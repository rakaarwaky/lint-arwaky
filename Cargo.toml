[package]
name = "lint_arwaky-arwaky"
version = "3.7.1"
edition = "2024"
description = "Autonomous code quality and architecture enforcement for AI agents and developers, enforcing 24 Agentic Engineering System (AES) rules."
license = "MIT"
repository = "https://github.com/rakaarwaky/lint-arwaky"
homepage = "https://github.com/rakaarwaky/lint-arwaky"
readme = "README.md"
default-run = "lint-arwaky"

[lib]
name = "lint_arwaky"
path = "crates/lib.rs"

[[bin]]
name = "lint-arwaky"
path = "crates/root_cli_main_entry.rs"

[[bin]]
name = "la"
path = "crates/root_cli_main_entry.rs"

[[bin]]
name = "lint-arwaky-cli"
path = "crates/root_cli_main_entry.rs"

[[bin]]
name = "lint-arwaky-mcp"
path = "crates/root_mcp_main_entry.rs"

[[bin]]
name = "lint-arwaky-tui"
path = "crates/root_tui_main_entry.rs"

