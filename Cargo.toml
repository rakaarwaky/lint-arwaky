[workspace]
resolver = "2"
members = [
    "crates/shared/src/auto_fix",
    "crates/shared/src/cli_commands",
    "crates/shared/src/common",
    "crates/shared/src/config_system",
    "crates/shared/src/doc_rules",
    "crates/shared/src/external_lint",
    "crates/shared/src/file_watch",
    "crates/shared/src/filesystem",
    "crates/shared/src/git_hooks",
    "crates/shared/src/import_rules",
    "crates/shared/src/maintenance",
    "crates/shared/src/mcp_server",
    "crates/shared/src/naming_rules",
    "crates/shared/src/orphan_rules",
    "crates/shared/src/project_setup",
    "crates/shared/src/quality_rules",
    "crates/shared/src/report_formatter",
    "crates/shared/src/role_rules",
    "crates/shared/src/structure_rules",
    "crates/shared/src/tui",
    "crates/filesystem",
    "crates/config-system",
    # Layer 2: Lint rules
    "crates/naming-rules",
    "crates/import-rules",
    "crates/quality-rules",
    "crates/orphan-rules",
    "crates/role-rules",
    "crates/external-lint",
    "crates/doc-rules",
    "crates/structure-rules",
    # Layer 3: Infrastructure
    "crates/auto-fix",
    "crates/git-hooks",
    "crates/file-watch",
    "crates/project-setup",
    "crates/maintenance",
    # Layer 3.5: Dispatcher
    "crates/dispatcher",
    # Layer 4: Surface
    "crates/report-formatter",
    "crates/cli-commands",
    "crates/mcp-server",
    "crates/tui",
]

[workspace.package]
edition = "2024"
publish = true
rust-version = "1.85.0"
license = "MIT"
repository = "https://github.com/rakaarwaky/lint-arwaky"

#do not bypass with allow
[workspace.lints.clippy]
result_large_err = "allow"
collapsible_if = "allow"
too_many_arguments = "allow"

[workspace.dependencies]
# Workspace member crates (version required for crates.io publish)
shared-auto-fix = { package = "shared-auto-fix-lint-arwaky", path = "crates/shared/src/auto_fix", version = "3.7.1" }
shared-cli-commands = { package = "shared-cli-commands-lint-arwaky", path = "crates/shared/src/cli_commands", version = "3.7.1" }
shared-common = { package = "shared-common-lint-arwaky", path = "crates/shared/src/common", version = "3.7.1" }
shared-config-system = { package = "shared-config-system-lint-arwaky", path = "crates/shared/src/config_system", version = "3.7.1" }
shared-doc-rules = { package = "shared-doc-rules-lint-arwaky", path = "crates/shared/src/doc_rules", version = "3.7.1" }
shared-external-lint = { package = "shared-external-lint-lint-arwaky", path = "crates/shared/src/external_lint", version = "3.7.1" }
shared-file-watch = { package = "shared-file-watch-lint-arwaky", path = "crates/shared/src/file_watch", version = "3.7.1" }
shared-filesystem = { package = "shared-filesystem-lint-arwaky", path = "crates/shared/src/filesystem", version = "3.7.1" }
shared-git-hooks = { package = "shared-git-hooks-lint-arwaky", path = "crates/shared/src/git_hooks", version = "3.7.1" }
shared-import-rules = { package = "shared-import-rules-lint-arwaky", path = "crates/shared/src/import_rules", version = "3.7.1" }
