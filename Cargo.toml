[workspace]
resolver = "2"
members = ["crates/shared", "crates/filesystem"]

#do not bypass with allow
[workspace.lints.clippy]

[workspace.dependencies]
# Workspace member crates (version required for crates.io publish)
shared = { package = "shared-lint-arwaky", path = "crates/shared", version = "1.11.0" }
filesystem = { package = "filesystem-lint-arwaky", path = "crates/filesystem", version = "1.11.0" }

# External dependencies (pinned versions - all crates inherit from here)
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
regex = "1.13.1"
tokio = { version = "1.53.1", features = ["full"] }
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
once_cell = "1.21.4"
async-trait = "0.1.91"
thiserror = "2.0.19"
anyhow = "1.0.104"
serde_yaml_ng = "0.10.0"
toml = "1.1.4"
clap = { version = "4.6.4", features = ["derive"] }
reqwest = { version = "0.13.4", features = ["blocking"] }
chrono = "0.4.44"
rmcp = { version = "3.0.1", features = ["server", "transport-io"] }
schemars = "1.2.2"
rand = "0.10.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rustsec = "0.33"
dirs = "6.0"
dialoguer = "0.12.0"
console = "0.16.4"
ctrlc = "3.4"
futures = "0.3.33"
rayon = "1.10"
ratatui = "0.30.2"
crossterm = "0.29.0"
arboard = "3"

[package]
name = "lint_arwaky-arwaky"
version = "1.11.0"
edition = "2024"
description = "Autonomous code quality and architecture enforcement for AI agents and developers, enforcing 27 Agentic Engineering System (AES) rules."
license = "MIT"
repository = "https://github.com/rakaarwaky/lint-arwaky"
homepage = "https://github.com/rakaarwaky/lint-arwaky"
readme = "README.md"

[lib]
name = "lint_arwaky"
path = "crates/lib.rs"

#[[bin]]
#name = "lint-arwaky-cli"
#path = "crates/root_cli_main_entry.rs"
#
#[[bin]]
#name = "lint-arwaky-mcp"
#path = "crates/root_mcp_main_entry.rs"
#
#[[bin]]
#name = "lint-arwaky-tui"
#path = "crates/root_tui_main_entry.rs"
#

[dependencies]
shared.workspace = true
filesystem.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
tokio.workspace = true
once_cell.workspace = true
async-trait.workspace = true
thiserror.workspace = true
anyhow.workspace = true
serde_yaml_ng.workspace = true
toml.workspace = true
clap.workspace = true
reqwest.workspace = true
chrono.workspace = true
rmcp.workspace = true
rand.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rustsec.workspace = true
dirs.workspace = true
dialoguer.workspace = true
console.workspace = true
ctrlc.workspace = true
futures.workspace = true

# Production release profile: small binary, fast startup, predictable runtime.
# `codegen-units=16` avoids intermittent SIGSEGV triggered by `codegen-units=1`
# combined with `opt-level=z` + `panic=abort` on large dep trees.
[profile.release]
opt-level = "z"
lto = false
codegen-units = 16
strip = "none"
panic = "abort"
debug = false
incremental = false

[profile.release.package.regex-automata]
opt-level = 0

[profile.release.package.regex-syntax]
opt-level = 0

# Dev profile: fast incremental builds for development.
[profile.dev]
opt-level = 0
debug = 0
strip = false
incremental = false
codegen-units = 1

# Test profile: prevent rust-lld relocation issues
[profile.test]
opt-level = 0
debug = 0
strip = false
codegen-units = 1




# Centralised lint policy — applied to every workspace crate via `lints.workspace = true`.
# The gate is: `cargo clippy --workspace --all-targets -- -D warnings`
# Only "forbid" rules (compile-breaking) and one truly universal "warn" rule
# (`unsafe_code`) live here. Everything else is fixed in the code, not silenced.
[workspace.lints.rust]
unsafe_code = "forbid"
