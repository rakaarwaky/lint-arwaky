[workspace]
resolver = "2"
members = ["crates/*"]

#do not bypass with allow
[workspace.lints.clippy]

[workspace.dependencies]
# Workspace member crates (version required for crates.io publish)
shared = { package = "shared-lint-arwaky", path = "crates/shared", version = "1.11.0" }
naming_rules = { package = "naming-rules-lint-arwaky", path = "crates/naming-rules", version = "1.11.0" }
import_rules = { package = "import-rules-lint-arwaky", path = "crates/import-rules", version = "1.11.0" }
code_analysis = { package = "code-analysis-lint-arwaky", path = "crates/code-analysis", version = "1.11.0" }
auto_fix = { package = "auto-fix-lint-arwaky", path = "crates/auto-fix", version = "1.11.0" }
cli_commands = { package = "cli-commands-lint-arwaky", path = "crates/cli-commands", version = "1.11.0" }
config_system = { package = "config-system-lint-arwaky", path = "crates/config-system", version = "1.11.0" }
file_watch = { package = "file-watch-lint-arwaky", path = "crates/file-watch", version = "1.11.0" }
git_hooks = { package = "git-hooks-lint-arwaky", path = "crates/git-hooks", version = "1.11.0" }
external_lint = { package = "external-lint-lint-arwaky", path = "crates/external-lint", version = "1.11.0" }
mcp_server = { package = "mcp-server-lint-arwaky", path = "crates/mcp-server", version = "1.11.0" }
orphan_detector = { package = "orphan-detector-lint-arwaky", path = "crates/orphan-detector", version = "1.11.0" }
project_setup = { package = "project-setup-lint-arwaky", path = "crates/project-setup", version = "1.11.0" }
maintenance = { package = "maintenance-lint-arwaky", path = "crates/maintenance", version = "1.11.0" }
role_rules = { package = "role-rules-lint-arwaky", path = "crates/role-rules", version = "1.11.0" }
report_formatter = { package = "report-formatter-lint-arwaky", path = "crates/report-formatter", version = "1.11.0" }

# External dependencies (pinned versions - all crates inherit from here)
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
regex = "1.13.1"
tokio = { version = "1.53.1", features = ["full"] }
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
once_cell = "1.21.4"
async-trait = "0.1.91"
thiserror = "2.0.19"
anyhow = "1.0.104"
serde_yaml_ng = "0.10.0"
toml = "1.1.3"
clap = { version = "4.6.4", features = ["derive"] }
reqwest = { version = "0.13.4", features = ["blocking"] }
chrono = "0.4.44"
rmcp = { version = "2.2.0", features = ["server", "transport-io"] }
schemars = "1.2.1"
rand = "0.10.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
rustsec = "0.33"
dirs = "6.0"
dialoguer = "0.12.0"
console = "0.16.4"
ctrlc = "3.4"
futures = "0.3.33"
rayon = "1.10"
ratatui = "0.30.2"
crossterm = "0.29.0"
arboard = "3"
tui = { package = "tui-lint-arwaky", path = "crates/tui", version = "1.11.0" }

[package]
name = "lint_arwaky-arwaky"
version = "1.11.0"
edition = "2021"
description = "Autonomous code quality and architecture enforcement for AI agents and developers, enforcing 27 Agentic Engineering System (AES) rules."
license = "MIT"
repository = "https://github.com/rakaarwaky/lint-arwaky"
homepage = "https://github.com/rakaarwaky/lint-arwaky"
readme = "README.md"

[lib]
name = "lint_arwaky"
path = "crates/lib.rs"

[[bin]]
name = "lint-arwaky-cli"
path = "crates/root_cli_main_entry.rs"

[[bin]]
name = "lint-arwaky-mcp"
path = "crates/root_mcp_main_entry.rs"

[[bin]]
name = "lint-arwaky-tui"
path = "crates/root_tui_main_entry.rs"


[dependencies]
shared.workspace = true
naming_rules.workspace = true
import_rules.workspace = true
code_analysis.workspace = true
auto_fix.workspace = true
cli_commands.workspace = true
config_system.workspace = true
file_watch.workspace = true
git_hooks.workspace = true
external_lint.workspace = true
mcp_server.workspace = true
orphan_detector.workspace = true
project_setup.workspace = true
maintenance.workspace = true
role_rules.workspace = true
report_formatter.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
tokio.workspace = true
once_cell.workspace = true
async-trait.workspace = true
thiserror.workspace = true
anyhow.workspace = true
serde_yaml_ng.workspace = true
toml.workspace = true
clap.workspace = true
reqwest.workspace = true
chrono.workspace = true
tui.workspace = true
rmcp.workspace = true
rand.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rustsec.workspace = true
dirs.workspace = true
dialoguer.workspace = true
console.workspace = true
ctrlc.workspace = true
futures.workspace = true

# Production release profile: small binary, fast startup, predictable runtime.
# `codegen-units=16` avoids intermittent SIGSEGV triggered by `codegen-units=1`
# combined with `opt-level=z` + `panic=abort` on large dep trees.
[profile.release]
opt-level = "z"
lto = false
codegen-units = 16
strip = "none"
panic = "abort"
debug = false
incremental = false

[profile.release.package.regex-automata]
opt-level = 0

[profile.release.package.regex-syntax]
opt-level = 0

# Dev profile: fast incremental builds for development.
[profile.dev]
opt-level = 0
debug = 0
strip = false
incremental = false
codegen-units = 1

# Test profile: prevent rust-lld relocation issues
[profile.test]
opt-level = 0
debug = 0
strip = false
codegen-units = 1




# Centralised lint policy — applied to every workspace crate via `lints.workspace = true`.
# The gate is: `cargo clippy --workspace --all-targets -- -D warnings`
# Only "forbid" rules (compile-breaking) and one truly universal "warn" rule
# (`unsafe_code`) live here. Everything else is fixed in the code, not silenced.
[workspace.lints.rust]
unsafe_code = "forbid"
