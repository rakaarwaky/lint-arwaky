<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lint Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header-left">
        <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 3v18h18"/>
          <path d="M7 16l4-4 4 4 4-8"/>
        </svg>
        <h1>Lint Arwaky</h1>
      </div>
      <div class="header-right">
        <span id="workspace-info" class="badge">No workspace</span>
        <span id="last-scan" class="badge">No scans yet</span>
      </div>
    </header>

    <main class="main">
      <!-- Empty State -->
      <div id="empty-state" class="empty-state">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 12l2 2 4-4"/>
          <path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <h2>No scan results</h2>
        <p>Run a scan to see violations</p>
        <code>cargo run --bin lint-arwaky-cli -- scan . --json</code>
      </div>

      <!-- Dashboard Content -->
      <div id="dashboard" class="dashboard hidden">
        <!-- Summary Cards -->
        <section class="summary">
          <div class="card card-total">
            <span class="card-value" id="total-count">0</span>
            <span class="card-label">Total</span>
          </div>
          <div class="card card-errors">
            <span class="card-value" id="error-count">0</span>
            <span class="card-label">Errors</span>
          </div>
          <div class="card card-warnings">
            <span class="card-value" id="warning-count">0</span>
            <span class="card-label">Warnings</span>
          </div>
          <div class="card card-info">
            <span class="card-value" id="info-count">0</span>
            <span class="card-label">Info</span>
          </div>
        </section>

        <!-- Charts Row -->
        <section class="charts-row">
          <!-- Severity Pie -->
          <div class="chart-card">
            <h3>By Severity</h3>
            <div class="chart-container">
              <canvas id="severity-chart"></canvas>
            </div>
          </div>

          <!-- Rule Groups -->
          <div class="chart-card">
            <h3>By Rule Group</h3>
            <div id="rule-groups" class="rule-groups"></div>
          </div>
        </section>

        <!-- File List -->
        <section class="files-section">
          <h3>Violations by File</h3>
          <div id="file-list" class="file-list"></div>
        </section>

        <!-- Import Data -->
        <section class="import-section">
          <h3>Import Scan Results</h3>
          <div class="import-box">
            <textarea id="import-data" placeholder="Paste JSON scan results here..."></textarea>
            <button id="import-btn" class="btn-primary">Import</button>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="main.ts"></script>
</body>
</html>
