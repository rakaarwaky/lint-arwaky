---
# workspaces-bad / workspaces-good contain intentional fixture code used by
# the linter's own tests — they must be excluded from Codacy analysis.
# Rust integration test crates add no signal to the analysis.
exclude_paths:
- "workspaces-bad/**"
- "workspaces-good/**"
- "crates/*/tests/**"
- "scripts/**"
- "tools/**"
- "CONTRIBUTING.md"
