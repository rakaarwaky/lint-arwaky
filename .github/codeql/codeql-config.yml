version: "1"
name: lint-arwaky-codeql

# workspaces-bad/ and workspaces-good/ are deliberate lint-rule fixtures: they
# contain intentional architecture violations, hardcoded secrets, and unsafe
# patterns so CodeQL must not report findings in them.
paths-ignore:
  - "workspaces-bad/**"
  - "workspaces-good/**"
  - ".worktree/**"
