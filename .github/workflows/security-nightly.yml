name: Security Audit (nightly)

on:
  schedule:
    - cron: '0 2 * * *'  # 02:00 UTC daily
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to audit'
        required: true
        default: 'main'

permissions:
  contents: read

jobs:
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1 stable
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@fd09ccbe70d174f3c26b2fa0588e8c07a7bf4f7e # v2.37.0
        with:
          tool: cargo-audit,cargo-deny
      - name: Run cargo-audit
        run: cargo audit
      # Advisory policy is enforced here alongside cargo-audit. License, ban,
      # and source sections remain a reviewed local policy until their existing
      # warning baseline can be made CI-blocking without unrelated failures.
      - name: Enforce cargo-deny advisory policy
        env:
          RUSTC_WRAPPER: ""
        run: cargo deny check advisories
