name: Debug Build

on:
  push:
    branches: [debug-build]

permissions:
  contents: read

jobs:
  debug:
    name: Annotated build diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1 stable
        with:
          components: clippy, rustfmt

      - name: Install mold + nextest
        run: |
          sudo apt-get update && sudo apt-get install -y mold
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ~/.cargo/bin

      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format check
        run: |
          set +e
          cargo fmt --all -- --check > fmt.log 2>&1
          if [ "$?" -ne 0 ]; then
            grep -a "^Diff in" fmt.log | head -10 | while IFS= read -r line; do
              echo "::error title=fmt::$line"
            done
            echo "FMT FAILED"
            # do not exit; keep collecting signal from later steps
          fi

      - name: Build
        run: |
          set +e
          CARGO_INCREMENTAL=0 cargo build --release > build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -a "error" build.log | head -10 | while IFS= read -r line; do
              clean=$(echo "$line" | sed 's/\x1b\[[0-9;]*m//g')
              echo "::error title=build::${clean:0:600}"
            done
            exit "$status"
          fi

      - name: Clippy
        run: |
          set +e
          CARGO_INCREMENTAL=0 cargo clippy --all-targets -- -D warnings > clippy.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            grep -a "error" clippy.log | head -10 | while IFS= read -r line; do
              clean=$(echo "$line" | sed 's/\x1b\[[0-9;]*m//g')
              echo "::error title=clippy::${clean:0:600}"
            done
            exit "$status"
          fi

      - name: Tests
        run: |
          set +e
          CARGO_INCREMENTAL=0 cargo nextest run --workspace --lib --tests -j 2 > test.log 2>&1
          status=$?
          grep -a "FAIL" test.log | head -10 | while IFS= read -r line; do
            clean=$(echo "$line" | sed 's/\x1b\[[0-9;]*m//g')
            echo "::error title=test::${clean:0:600}"
          done
          if [ "$status" -ne 0 ]; then
            grep -a -A12 "FAIL\b" test.log | head -40
            exit "$status"
          fi

      - name: Self-lint
        run: |
          set +e
          ./target/release/lint-arwaky-cli check . > selflint.log 2>&1
          status=$?
          tail -40 selflint.log
          if [ "$status" -ne 0 ]; then
            grep -a "AES\|Total" selflint.log | head -10 | while IFS= read -r line; do
              echo "::error title=selflint::${line:0:600}"
            done
            exit "$status"
          fi
