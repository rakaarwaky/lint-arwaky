name: Close-Evidence Check

# Validates that any PR declaring 'Closes #N' carries regression evidence.
# Fails the check if a PR closes issues without the required evidence markers,
# preventing the silent re-open of defects (issue #584 / PR #748 failure mode).

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-close-evidence:
    name: Check closure evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (main ref only — no PR code execution)
        # Uses the base ref so this check cannot be subverted by PR content.
        # The PR body is read via the API, not by checking out PR code.
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 1

      - name: Read PR body, diff, and check script via GitHub API
        # Extracts the PR body, changed file paths, and the check script
        # without checking out untrusted PR code (pull_request_target style,
        # read-only). The script is fetched from the head ref via the API;
        # only the script file is executed, never the full PR tree.
        # Body is written to a file; the file path (not content) goes into
        # GITHUB_ENV to avoid multiline KEY=VALUE format errors.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" \
            --jq '.body // ""' > /tmp/pr_body.txt
          DIFF_FILES=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" --paginate \
            | python3 -c "
          import sys, json
          files = json.load(sys.stdin)
          print(','.join(f['filename'] for f in files))
          ")
          echo "PR_DIFF=${DIFF_FILES}" >> "$GITHUB_ENV"
          # The check script lives in the PR itself; fetch it from the head
          # ref. Execution is limited to this single file.
          HEAD_SHA=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.head.sha')
          gh api "repos/${{ github.repository }}/contents/.github/scripts/check_close_evidence.py" \
            -H "Accept: application/vnd.github.raw" \
            -f ref="${HEAD_SHA}" > /tmp/check_close_evidence.py
          chmod +x /tmp/check_close_evidence.py

      - name: Run close-evidence check
        run: |
          set -euo pipefail
          python3 /tmp/check_close_evidence.py /tmp/pr_body.txt "${PR_DIFF:-}"
