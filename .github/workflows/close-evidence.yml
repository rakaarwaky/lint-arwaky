name: Close-Evidence Check

# Validates that any PR declaring 'Closes #N' carries regression evidence.
# Fails the check if a PR closes issues without the required evidence markers,
# preventing the silent re-open of defects (issue #584 / PR #748 failure mode).

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-close-evidence:
    name: Check closure evidence
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (main ref only — no PR code execution)
        # Uses the base ref so this check cannot be subverted by PR content.
        # The PR body is read via the API, not by checking out PR code.
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 1

      - name: Read PR body and diff via GitHub API
        # Extracts the PR body and changed file paths without checking out
        # untrusted PR code (pull_request_target style, but read-only).
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          BODY_JSON=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" --jq '.body // ""')
          DIFF_FILES=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" --paginate \
            | python3 -c "
          import sys, json, csv
          files = json.load(sys.stdin)
          print(','.join(f['filename'] for f in files))
          ")
          echo "PR_BODY=${BODY_JSON}" >> "$GITHUB_ENV"
          echo "PR_DIFF=${DIFF_FILES}" >> "$GITHUB_ENV"

      - name: Run close-evidence check
        env:
          PR_BODY_FILE: /dev/stdin
        run: |
          set -euo pipefail
          # Write PR body to a temp file for the script.
          printf '%s' "${PR_BODY:-}" > /tmp/pr_body.txt
          python3 .github/scripts/check_close_evidence.py /tmp/pr_body.txt "${PR_DIFF:-}"
