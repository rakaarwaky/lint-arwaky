name: Close-Evidence Check

# Validates that any PR using a closing keyword ('Closes/Fixes/Resolves #N')
# carries regression evidence. Fails the check if a PR closes an issue without
# the required evidence markers, preventing the silent re-open of defects
# (issue #584 / PR #748 failure mode).

# `pull_request_target`, not `pull_request`: this workflow gates PRs, so it must
# run from the trusted base-branch definition. Under `pull_request` a PR could
# edit this file and the edited copy would run, letting it skip the gate while
# the `Check closure evidence` job still reported success. Nothing from the PR is
# checked out or executed — the PR body and file list come from the API, and the
# check script is read from the BASE ref, not the head ref.
on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-close-evidence:
    name: Check closure evidence
    runs-on: ubuntu-latest
    steps:
      # No `actions/checkout` of PR code. The script is read from the base ref
      # through the API below, so the only thing on disk is trusted.
      - name: Read PR body and changed-file list via GitHub API
        id: api
        # `--slurp` wraps each page in its own array, so a PR with more than 30
        # changed files yields one array per page instead of concatenated JSON
        # documents that `json.load` cannot parse.
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}" \
            --jq '.body // ""' > /tmp/pr_body.txt
          DIFF_FILES=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" --paginate --slurp \
            | python3 -c "
          import sys, json
          pages = json.load(sys.stdin)
          files = [f for page in pages for f in page]
          print(','.join(f['filename'] for f in files))
          ")
          echo "PR_DIFF=${DIFF_FILES}" >> "$GITHUB_ENV"
          # The script comes from the BASE ref, never the PR head, so a PR
          # cannot weaken the rule that checks it.
          if ! gh api "repos/${{ github.repository }}/contents/.github/scripts/check_close_evidence.py?ref=${BASE_SHA}" \
              -H "Accept: application/vnd.github.raw" > /tmp/check_close_evidence.py 2>/dev/null; then
            echo "Check script not present on the base ref — skipping (pass)."
            echo "result=script_missing" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "result=found" >> "${GITHUB_OUTPUT}"

      - name: Run close-evidence check
        if: ${{ !contains(steps.api.outputs.result, 'script_missing') }}
        run: |
          set -euo pipefail
          python3 /tmp/check_close_evidence.py /tmp/pr_body.txt "${PR_DIFF:-}"