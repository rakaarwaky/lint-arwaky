name: Cleanup merged branches

# Automatically deletes branches after their PR is merged, keeping the
# remote branch list tidy for solo development.

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    name: Delete merged branch
    runs-on: ubuntu-latest
    # Only delete branches from this repository — never a fork. A fork PR's
    # head.ref names a branch in the fork, which must not be deleted here
    # (and could otherwise collide with a same-named branch in this repo).
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Delete remote branch
        run: |
          # The branch name arrives via an environment variable (safely
          # escaped by the runner) instead of inline interpolation, and is
          # validated against a strict pattern before use.
          BRANCH="$BRANCH_NAME"

          # Never delete protected branches
          if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "develop" ]; then
            echo "Skipping protected branch: ${BRANCH}"
            exit 0
          fi

          # Reject anything that is not a valid git ref name to prevent shell
          # injection through a crafted branch name. Git forbids spaces and
          # ~ ^ : ? * [ \ and a few edge cases, but allows + and -.
          if ! [[ "$BRANCH" =~ ^[A-Za-z0-9._/+-]+$ ]]; then
            echo "Skipping branch with unsafe characters: ${BRANCH}"
            exit 0
          fi
          if [[ "$BRANCH" == .* ]] || [[ "$BRANCH" == *..* ]] || [[ "$BRANCH" == *.lock ]] || [[ "$BRANCH" == *@* ]]; then
            echo "Skipping invalid git ref name: ${BRANCH}"
            exit 0
          fi

          # Delete the branch. Treat a 404 as "already deleted" (idempotent);
          # any other failure fails the job so it is not silently swallowed.
          # Use --include to capture response headers and parse the HTTP status.
          RESPONSE=$(gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/${BRANCH}" \
            --include --silent 2>&1 || true)
          STATUS=$(printf '%s' "$RESPONSE" | head -1 | grep -oE '[0-9]{3}' | head -1)
          if [ -z "$STATUS" ]; then
            echo "Failed to delete branch ${BRANCH}: no HTTP status returned."
            exit 1
          fi
          if [ "$STATUS" = "404" ]; then
            echo "Branch ${BRANCH} already deleted."
          elif [ "$STATUS" = "204" ]; then
            echo "Deleted branch ${BRANCH}."
          else
            echo "Failed to delete branch ${BRANCH} (HTTP ${STATUS})."
            exit 1
          fi
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
