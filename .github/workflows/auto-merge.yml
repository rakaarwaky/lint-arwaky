name: Auto-merge gated PRs

# Enables GitHub's native auto-merge (squash) on release PRs only.
# All other PRs are merged by Mergify's merge queue — see .mergify.yml.
# The GitHub ruleset on main requires the 6 quality-gate checks
# (Format, Clippy, Build, Tests, Self-Lint, Codacy). GitHub's native
# auto-merge holds the PR until those checks succeed, then merges.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  pull-requests: write
  contents: write

jobs:
  enable-auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-latest
    # Only for release PRs targeting main: opened by the release bot,
    # head branch matches release/v*, and not a draft. All other PRs
    # are merged by Mergify's queue — do NOT enable GitHub auto-merge
    # on them, as it would race against the integration-commit run.
    if: >
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.merged == false &&
      startsWith(github.event.pull_request.head.ref, 'release/v') &&
      github.event.pull_request.user.login == 'github-actions[bot]'
    steps:
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Values arrive via env vars (escaped by the runner), never inline
          # interpolation, to prevent command injection through PR metadata.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # --auto holds the PR until the branch-protection/required checks
          # pass, then merges with squash. Idempotent across re-runs.
          gh pr merge "$PR_NUMBER" --auto --squash \
            --subject "$PR_TITLE" || \
            echo "Auto-merge not available yet (e.g. checks still pending) — a later event will retry."
