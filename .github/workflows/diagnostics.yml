name: Diagnostics
# TEMPORARY — remove before merge.
#
# CI logs live on Azure blob storage, which this development sandbox cannot
# reach, so the compiler's messages in the failing jobs were unreadable. This
# workflow runs the same checks and re-emits every diagnostic as a workflow
# *annotation*, which the public check-runs API does expose.
on:
  push:
    branches: [arena/14b199d5-lint-arwaky]
  workflow_dispatch:

env:
  # The real CI sets RUSTC_WRAPPER=sccache with a sibling action that installs
  # it. This job does not, and an inherited wrapper that is not on PATH makes
  # every cargo invocation fail before compiling anything.
  RUSTC_WRAPPER: ""
  CARGO_TERM_COLOR: never

jobs:
  diagnose:
    name: Diagnose
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1 stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: build cli for self-lint
        run: cargo build --bin lint-arwaky-cli 2>&1 | tail -3

      - name: cargo fmt
        if: always()
        run: |
          cargo fmt --all -- --check > /tmp/fmt.txt 2>&1 || true
          # GitHub caps annotations at 10 per step, so one annotation carries
          # the whole report; newlines become "~" to stay on one line.
          body=$(head -c 55000 /tmp/fmt.txt | sed -e 's/%/%25/g' | tr '\n' '~')
          echo "::error title=fmt::$body"

      - name: cargo check
        if: always()
        run: |
          cargo check --all-targets --message-format=short > /tmp/check.txt 2>&1 || true
          grep -E "^[^ ]+\.rs:[0-9]+:[0-9]+: (error|warning)|^error(\[|:)" /tmp/check.txt > /tmp/check_err.txt || true
          echo "::notice title=check-lines::$(wc -l < /tmp/check.txt) total, $(wc -l < /tmp/check_err.txt) errors"
          body=$(head -c 55000 /tmp/check_err.txt | sed -e 's/%/%25/g' | tr '\n' '~')
          echo "::error title=check::$body"

      - name: cargo test
        if: always()
        run: |
          cargo test --workspace --no-fail-fast > /tmp/test.txt 2>&1 || true
          grep -E "^(test .* FAILED|failures:|---- .* stdout ----|thread .* panicked|error: test failed)" -A3 /tmp/test.txt > /tmp/test_err.txt || true
          echo "::notice title=test-lines::$(wc -l < /tmp/test.txt) total, $(grep -c 'FAILED' /tmp/test.txt || true) failed"
          body=$(head -c 55000 /tmp/test_err.txt | sed -e 's/%/%25/g' | tr '\n' '~')
          echo "::error title=test::$body"

      - name: self lint
        if: always()
        run: |
          # Mirror the real Self-Lint step: `check .` must exit 0 with zero
          # violations.
          exit_code=0
          ./target/debug/lint-arwaky-cli check . > /tmp/self.txt 2>&1 || exit_code=$?
          echo "::notice title=self-exit::exit=$exit_code"
          tail -120 /tmp/self.txt > /tmp/self_tail.txt || true
          body=$(head -c 55000 /tmp/self_tail.txt | sed -e 's/%/%25/g' | tr '\n' '~')
          echo "::error title=self::$body"

      - name: cargo clippy
        if: always()
        run: |
          cargo clippy --all-targets --message-format=short > /tmp/clippy.txt 2>&1 || true
          echo "::notice title=clippy-head::$(tail -3 /tmp/clippy.txt | tr '\n' '~' | sed -e 's/%/%25/g')"
          grep -E "^[^ ]+\.rs:[0-9]+:[0-9]+: (error|warning)|^error(\[|:)" /tmp/clippy.txt > /tmp/clippy_err.txt || true
          echo "::notice title=clippy-lines::$(wc -l < /tmp/clippy.txt) total, $(wc -l < /tmp/clippy_err.txt) findings"
          body=$(head -c 55000 /tmp/clippy_err.txt | sed -e 's/%/%25/g' | tr '\n' '~')
          echo "::error title=clippy::$body"
