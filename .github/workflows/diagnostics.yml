name: Diagnostics

# Temporary Arena-session workflow. The agent sandbox has no Rust toolchain and
# no access to Actions log storage, so this job runs the quality gates,
# auto-applies rustfmt, and commits gate logs back to this branch where they
# can be read via git. Remove this workflow (and the .diag directory) before
# marking the PR ready for review.
on:
  push:
    branches: [arena/01a0f6e0-lint-arwaky]

permissions:
  contents: write

concurrency:
  group: diagnostics-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: 4
  RUST_MIN_STACK: 33554432
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "false"

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: clippy, rustfmt
      - name: Install mold + nextest
        run: |
          sudo apt-get update && sudo apt-get install -y mold
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ~/.cargo/bin
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - name: Start sccache
        run: sccache --start-server || true

      - name: Apply rustfmt and push if needed
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "arena-diagnostics-bot"
            git config user.email "arena-diagnostics-bot@users.noreply.github.com"
            git add -A
            git commit -m "style: apply rustfmt (diagnostics bot)"
            git pull --rebase origin arena/01a0f6e0-lint-arwaky || true
            git push
          fi

      - name: Run clippy
        continue-on-error: true
        run: |
          mkdir -p .diag
          CARGO_INCREMENTAL=0 cargo clippy --all-targets -- -D warnings > .diag/clippy.log 2>&1
          echo "clippy exit code: $?" >> .diag/clippy.log

      - name: Build release and run tests
        continue-on-error: true
        run: |
          CARGO_INCREMENTAL=0 cargo build --release > .diag/build.log 2>&1
          echo "release build exit code: $?" >> .diag/build.log
          cargo nextest run --workspace --lib --tests -j 2 > .diag/tests.log 2>&1
          echo "nextest exit code: $?" >> .diag/tests.log

      - name: Run self-lint
        continue-on-error: true
        run: |
          CARGO_INCREMENTAL=0 cargo build --bin lint-arwaky-cli >> .diag/build.log 2>&1
          ./target/debug/lint-arwaky-cli check . > .diag/selflint.log 2>&1
          echo "self-lint exit code: $?" >> .diag/selflint.log
          ./target/debug/lint-arwaky-cli scan workspaces-bad >> .diag/selflint.log 2>&1
          echo "scan exit code: $?" >> .diag/selflint.log

      - name: Commit diagnostics
        if: always()
        run: |
          git config user.name "arena-diagnostics-bot"
          git config user.email "arena-diagnostics-bot@users.noreply.github.com"
          git pull --rebase origin arena/01a0f6e0-lint-arwaky || true
          git add .diag || true
          git diff --cached --quiet && echo "no diagnostics to commit" && exit 0
          git commit -m "diag: capture gate logs"
          git push || echo "diag push rejected; logs will be recaptured next run"
