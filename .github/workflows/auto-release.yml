name: Auto-Release

# Creates a versioned release automatically after CI passes on main.
# Conventional commit types drive the version bump:
#   feat! / fix! / BREAKING CHANGE footer -> MAJOR
#   feat                                -> MINOR
#   fix / other                         -> PATCH
# Also appends to CHANGELOG.md and tags the release.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  RUST_MIN_STACK: 33554432

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    # Only run when CI succeeded on a push to main; skip the version-bump
    # commit itself (prevents an infinite release loop). Manual dispatch must
    # target refs/heads/main — never run the privileged release path otherwise.
    if: >
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_commit.message != 'Initial commit' &&
       !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):'))
    steps:
      # Checkout main directly. The job-level `if` guarantees this only runs
      # for pushes to main whose CI succeeded, so there is no need to check
      # out an untrusted PR ref (which Codacy flags as a security risk).
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Determine next version from commit history
        id: version
        run: |
          # Newest v* tag reachable from HEAD, preserving descending version sort.
          LAST_TAG=$(git tag --merged HEAD --sort=-v:refname | grep '^v' | head -1)
          if [ -z "$LAST_TAG" ]; then
            # No tags yet — derive base version from Cargo.toml and inspect all commits.
            # grep must fail through to the default when there is no root version.
            CURRENT_LINE=$(grep -m1 '^version' Cargo.toml || true)
            CURRENT=$(echo "$CURRENT_LINE" | sed 's/.*= *"\(.*\)"/\1/')
            if [ -z "$CURRENT" ]; then
              CURRENT="0.1.0"
            fi
            LAST_TAG="v${CURRENT}"
            RANGE="HEAD"
            echo "range=${RANGE}" >> "$GITHUB_OUTPUT"
          else
            RANGE="${LAST_TAG}..HEAD"
            echo "range=${RANGE}" >> "$GITHUB_OUTPUT"
          fi
          echo "last_tag=${LAST_TAG}" >> "$GITHUB_OUTPUT"

          # Conventional commit detection.
          # Breaking change via subject: `feat!:`, `feat(scope)!:`, `fix!:` etc.
          MAJOR_SUBJECT=$(git log "$RANGE" --oneline --grep='^[a-zA-Z]*(.*)!:' -E | head -1)
          # Breaking change via footer: `BREAKING CHANGE: ...` in the body.
          MAJOR_FOOTER=$(git log "$RANGE" --format=%B | grep -m1 '^BREAKING CHANGE:' || true)
          # Minor: only `feat:` or `feat(scope):` — not e.g. `feature:`.
          FEAT=$(git log "$RANGE" --oneline --grep='^feat(\([^)]+\))?:' -E | head -1)

          BASE="${LAST_TAG#v}"
          IFS='.' read -r MAJ_V MIN_V PAT_V <<< "$BASE"
          MAJ_V=${MAJ_V:-0}; MIN_V=${MIN_V:-0}; PAT_V=${PAT_V:-0}

          if [ -n "$MAJOR_SUBJECT" ] || [ -n "$MAJOR_FOOTER" ]; then
            NEW="$((MAJ_V + 1)).0.0"
          elif [ -n "$FEAT" ]; then
            NEW="${MAJ_V}.$((MIN_V + 1)).0"
          else
            NEW="${MAJ_V}.${MIN_V}.$((PAT_V + 1))"
          fi
          echo "version=${NEW}" >> "$GITHUB_OUTPUT"
          echo "New version: ${NEW}"

      - name: Update Cargo.toml version
        run: |
          sed -i "s/^version = .*/version = \"${{ steps.version.outputs.version }}\"/" Cargo.toml
          # Refresh Cargo.lock so the root package version stays in sync.
          # Fail loudly if lockfile generation fails so Cargo.toml and
          # Cargo.lock never drift apart silently.
          cargo generate-lockfile

      - name: Update CHANGELOG.md
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DATE=$(date +%Y-%m-%d)
          RANGE="${{ steps.version.outputs.range }}"
          # Group conventional commit messages since the previous release.
          FEATS=$(git log "$RANGE" --pretty=format:'- %s' --grep='^feat(\([^)]+\))?:' -E | head -20)
          FIXES=$(git log "$RANGE" --pretty=format:'- %s' --grep='^fix(\([^)]+\))?:' -E | head -20)
          CHORES=$(git log "$RANGE" --pretty=format:'- %s' --grep='^(chore|refactor|docs|test|perf)(\([^)]+\))?:' -E | head -20)
          python3 - "$VERSION" "$DATE" "$FEATS" "$FIXES" "$CHORES" <<'PYEOF'
          import sys
          version, date, feats, fixes, chores = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4], sys.argv[5]
          sections = []
          if feats.strip():
              sections.append("### Features\n\n" + feats.strip())
          if fixes.strip():
              sections.append("### Bug Fixes\n\n" + fixes.strip())
          if chores.strip():
              sections.append("### Maintenance\n\n" + chores.strip())
          if not sections:
              sections.append("- No significant changes")
          body = "\n\n".join(sections)
          entry = f"## {version} ({date})\n\n{body}\n\n"
          with open('CHANGELOG.md') as f:
              content = f.read()
          first_nl = content.index('\n') + 1
          with open('CHANGELOG.md', 'w') as f:
              f.write(content[:first_nl] + entry + content[first_nl:])
          PYEOF

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin main --tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger release build
        # Explicitly dispatch the packaging workflow for the new tag so the
        # release pipeline runs immediately and deterministically.
        run: gh workflow run release.yml --ref "v${{ steps.version.outputs.version }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
