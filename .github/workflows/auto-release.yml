name: Auto-Release

# Creates a versioned release automatically after merge to main.
# Conventional commit types drive the version bump:
#   feat! / fix! / breaking change  -> MAJOR
#   feat                            -> MINOR
#   fix / other                     -> PATCH
# Also appends to CHANGELOG.md and tags the release.

on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  RUST_MIN_STACK: 33554432

jobs:
  release:
    name: Tag and release
    runs-on: ubuntu-latest
    # Skip if the triggering commit is the version-bump commit itself
    # (prevents an infinite release loop).
    if: github.event.head_commit.message != 'Initial commit' && !startsWith(github.event.head_commit.message, 'chore(release):')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Determine next version from commit history
        id: version
        run: |
          # Tags since last tag; default to current Cargo.toml version
          LAST_TAG=$(git tag --sort=-v:refname | head -1)
          if [ -z "$LAST_TAG" ]; then
            CURRENT=$(grep -m1 '^version' Cargo.toml | sed 's/.*= *"\(.*\)"/\1/')
            LAST_TAG="v${CURRENT}"
          fi
          echo "last_tag=${LAST_TAG}" >> "$GITHUB_OUTPUT"

          # Conventional commit detection since last tag (or all if none)
          RANGE="${LAST_TAG}..HEAD"
          MAJOR=$(git log "$RANGE" --oneline --grep='^[a-z]*(.*)!' -E | head -1)
          FEAT=$(git log "$RANGE" --oneline --grep='^feat' | head -1)
          FIX=$(git log "$RANGE" --oneline --grep='^fix' | head -1)

          BASE="${LAST_TAG#v}"
          IFS='.' read -r MAJ_V MIN_V PAT_V <<< "$BASE"
          MAJ_V=${MAJ_V:-0}; MIN_V=${MIN_V:-0}; PAT_V=${PAT_V:-0}

          if [ -n "$MAJOR" ]; then
            NEW="${MAJ_V}.0.0"
          elif [ -n "$FEAT" ]; then
            NEW="${MAJ_V}.$((MIN_V + 1)).0"
          else
            NEW="${MAJ_V}.${MIN_V}.$((PAT_V + 1))"
          fi
          echo "version=${NEW}" >> "$GITHUB_OUTPUT"
          echo "New version: ${NEW}"

      - name: Update Cargo.toml version
        run: |
          sed -i "s/^version = .*/version = \"${{ steps.version.outputs.version }}\"/" Cargo.toml
          # Refresh Cargo.lock so the root package version stays in sync.
          cargo generate-lockfile 2>/dev/null || true

      - name: Update CHANGELOG.md
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DATE=$(date +%Y-%m-%d)
          RANGE="${{ steps.version.outputs.last_tag }}..HEAD"
          # Group conventional commit messages since the previous release.
          FEATS=$(git log "$RANGE" --pretty=format:'- %s' --grep='^feat' -E | head -20)
          FIXES=$(git log "$RANGE" --pretty=format:'- %s' --grep='^fix' -E | head -20)
          CHORES=$(git log "$RANGE" --pretty=format:'- %s' --grep='^chore\|^refactor\|^docs\|^test\|^perf' -E | head -20)
          python3 - "$VERSION" "$DATE" "$FEATS" "$FIXES" "$CHORES" <<'PYEOF'
          import sys
          version, date, feats, fixes, chores = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4], sys.argv[5]
          sections = []
          if feats.strip():
              sections.append("### Features\n\n" + feats.strip())
          if fixes.strip():
              sections.append("### Bug Fixes\n\n" + fixes.strip())
          if chores.strip():
              sections.append("### Maintenance\n\n" + chores.strip())
          if not sections:
              sections.append("- No significant changes")
          body = "\n\n".join(sections)
          entry = f"## {version} ({date})\n\n{body}\n\n"
          with open('CHANGELOG.md') as f:
              content = f.read()
          first_nl = content.index('\n') + 1
          with open('CHANGELOG.md', 'w') as f:
              f.write(content[:first_nl] + entry + content[first_nl:])
          PYEOF

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin main --tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
