name: Benchmarks

# Nightly Criterion run against a cached baseline so the documented
# performance budget (README.md → Performance; PRD.md → Success Metrics
# table, metric #2) has automated regression detection instead of being
# aspirational.
# The job is advisory: it reports regressions on the run summary and fails
# the job (visible on scheduled-run alerts), but it does not block PRs —
# per-PR benchmarking on shared runners is too noisy for a hard gate.
on:
  schedule:
    # 03:20 UTC nightly — off-peak, after other scheduled jobs.
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: 4
  RUST_MIN_STACK: 33554432
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "false"

jobs:
  bench:
    name: Criterion benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1 stable
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Restore benchmark baseline
        uses: actions/cache@v6
        with:
          path: target/criterion
          # Pin the baseline to the benchmark definition, not the run id: the
          # key is stable across runs so the newest green main baseline is
          # restored (GitHub Actions caches are immutable, so a real refresh
          # only happens when the benchmark source changes the hash below).
          # The previous key embedded ${{ github.run_id }}, which made every
          # restore miss the exact key and fall back to the *previous run's*
          # `target/criterion` via restore-keys — so the "baseline" was a
          # single noisy shared-runner sample and small or large apparent
          # changes alike tripped the hard gate on the same commit.
          key: criterion-baseline-v2-${{ runner.os }}-${{ hashFiles('crates/*/benches/**/*.rs', 'Cargo.lock') }}
          restore-keys: |
            criterion-baseline-v2-${{ runner.os }}-

      - name: Run workspace benchmarks
        run: |
          mkdir -p bench-out
          set +e
          cargo bench --workspace > bench-out/bench.log 2>&1
          status=$?
          echo "cargo bench exit code: $status"
          tail -40 bench-out/bench.log
          exit $status

      - name: Detect regressions vs baseline
        run: |
          # Criterion prints "Performance has regressed." for every benchmark
          # whose change vs the baseline is statistically significant
          # (p < 0.05). On shared GitHub runners a single noisy sample can
          # shift the apparent mean by tens of percent even for an unchanged
          # commit, so significance alone is too sensitive for a hard gate.
          #
          # Fail only when a regression is BOTH statistically significant AND
          # practically meaningful: the point estimate exceeds
          # NOISE_THRESHOLD_PCT (the documented budget's per-benchmark noise
          # allowance). Smaller significant shifts are reported but do not
          # fail the job.
          #
          # 60% covers the worst same-commit drift observed on shared runners
          # (~50% on unchanged code between two nightly runs of v3.18.6),
          # while still catching genuine algorithmic regressions (2x+).
          NOISE_THRESHOLD_PCT=60
          fail=0
          # The line before a regression marker is either a `change:` line
          # (time +X%) for plain benchmarks or a `thrpt:` line (throughput
          # -X%) for throughput benchmarks. Extract the magnitude either way.
          while IFS= read -r line; do
            pct=""
            # `change:` lines use ASCII +/-; `thrpt:` lines use the Unicode
            # minus (U+2212). Accept either sign in both patterns.
            if echo "$line" | grep -q 'change:'; then
              pct=$(echo "$line" | grep -oP 'change:\s*\[\s*[+\-\x{2212}]?\d+(?:\.\d+)?%\s+[+\-\x{2212}]?\K\d+(?:\.\d+)?(?=%)' || true)
            elif echo "$line" | grep -q 'thrpt:'; then
              pct=$(echo "$line" | grep -oP 'thrpt:\s*\[\s*[+\-\x{2212}]?\d+(?:\.\d+)?%\s+[+\-\x{2212}]?\K\d+(?:\.\d+)?(?=%)' || true)
            fi
            if [ -n "$pct" ]; then
              over=$(awk -v p="$pct" -v t="$NOISE_THRESHOLD_PCT" 'BEGIN{print (p > t) ? 1 : 0}')
              if [ "$over" = "1" ]; then
                echo "::error title=Benchmark regression::${pct}% regression exceeds ${NOISE_THRESHOLD_PCT}% noise budget"
                fail=1
              else
                echo "notice: ${pct}% regression within ${NOISE_THRESHOLD_PCT}% noise budget — not failing"
              fi
            fi
          done < <(grep -B2 "Performance has regressed" bench-out/bench.log || true)

          if [ "$fail" -ne 0 ]; then
            echo "::error title=Benchmark regression::One or more benchmarks regressed beyond the noise budget — see the run log"
            grep -B2 -A2 "Performance has regressed" bench-out/bench.log || true
            exit 1
          fi
          echo "No regressions beyond the ${NOISE_THRESHOLD_PCT}% noise budget."

      - name: Publish benchmark results
        if: always()
        run: |
          mkdir -p bench-artifacts
          cp bench-out/bench.log bench-artifacts/
          if [[ -d target/criterion && $(du -s target/criterion | cut -f1) -lt 5242880 ]]; then
            cp -r target/criterion bench-artifacts/
          fi
          echo "## Criterion benchmark run"
          echo
          grep -E "^(time:|change:|thrpt:)|regressed|improved|No change" bench-out/bench.log | head -200 || true

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ github.run_id }}
          path: bench-artifacts/

      - name: Post PR comment (if PR)
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try {
              log = fs.readFileSync('bench-artifacts/bench.log', 'utf8')
                .split('\n')
                .filter(l => /^(time:|change:|thrpt:)/.test(l) || /regressed|improved|No change/.test(l))
                .slice(0, 100)
                .join('\n');
            } catch (e) {
              log = 'No benchmark log produced — see the workflow run for the failure.';
            }
            const commentBody = `## Benchmark Results\n\nSee workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\n\`\`\`\n${log}\n\`\`\``;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody
            });

      - name: Benchmark summary
        if: always()
        run: |
          {
            echo "## Criterion benchmark run"
            echo
            grep -E "^(time:|change:|thrpt:)|regressed|improved|No change" bench-out/bench.log | head -200 || true
          } >> "$GITHUB_STEP_SUMMARY"
