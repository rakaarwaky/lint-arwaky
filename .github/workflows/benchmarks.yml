name: Benchmarks

# Nightly Criterion run against a cached baseline so the documented
# performance budget (README.md → Performance; PRD.md → NFR table) has
# automated regression detection instead of being aspirational.
# The job is advisory: it reports regressions on the run summary and fails
# the job (visible on scheduled-run alerts), but it does not block PRs —
# per-PR benchmarking on shared runners is too noisy for a hard gate.
on:
  schedule:
    # 03:20 UTC nightly — off-peak, after other scheduled jobs.
    - cron: "20 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_BUILD_JOBS: 4
  RUST_MIN_STACK: 33554432
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "false"

jobs:
  bench:
    name: Criterion benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1 stable
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Restore benchmark baseline
        uses: actions/cache@v4
        with:
          path: target/criterion
          key: criterion-baseline-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            criterion-baseline-${{ runner.os }}-

      - name: Run workspace benchmarks
        run: |
          mkdir -p bench-out
          set +e
          cargo bench --workspace > bench-out/bench.log 2>&1
          status=$?
          echo "cargo bench exit code: $status"
          tail -40 bench-out/bench.log
          exit $status

      - name: Detect regressions vs baseline
        run: |
          # Criterion prints "Performance has regressed." for every benchmark
          # whose change vs the cached baseline exceeds its noise threshold.
          if grep -q "Performance has regressed" bench-out/bench.log; then
            echo "::error title=Benchmark regression::Criterion reported regressions vs the cached baseline — see the run log"
            grep -B2 -A2 "Performance has regressed" bench-out/bench.log || true
            exit 1
          fi
          echo "No regressions vs baseline."

      - name: Benchmark summary
        if: always()
        run: |
          {
            echo "## Criterion benchmark run"
            echo
            grep -E "^(time:|change:|thrpt:)|regressed|improved|No change" bench-out/bench.log | head -200 || true
          } >> "$GITHUB_STEP_SUMMARY"
