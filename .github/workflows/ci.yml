name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  RUST_MIN_STACK: 33554432
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "false"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1 stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  doc-consistency:
    name: Doc Consistency
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cross-document consistency gate
        run: python3 tools/check_doc_consistency.py

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1 stable
        with:
          components: clippy
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --all-targets -- -D warnings

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1 stable
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1 stable
      - name: Install mold + nextest
        run: |
          sudo apt-get update && sudo apt-get install -y mold
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ~/.cargo/bin
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build release binary (for regression tests)
        run: cargo build --release

      - name: Run tests
        # Note: cargo-nextest cannot execute doctests (known upstream
        # limitation) — doctests are run as a separate step below (QA #644).
        run: cargo nextest run --workspace --lib --tests -j 2

      - name: Run doctests
        # QA #638: ~25 doctests across 11 source files are only executed here;
        # nextest cannot substitute for `cargo test --doc`.
        run: cargo test --doc --workspace

  self-lint:
    name: Self-Lint
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1 stable
      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install external linters (per TEST.md §1 prerequisite, QA #637)
        run: |
          python3 -m pip install ruff mypy bandit
          npm install -g eslint prettier typescript

      - name: Build CLI
        run: cargo build --bin lint-arwaky-cli

      - name: AES Self-Lint
        # QA #642: never default unparseable/crashed output to "0 violations".
        # The regex must match a `Total:` line and the CLI exit code must be
        # checked, otherwise a tool failure would silently pass as clean.
        run: |
          output=$(./target/debug/lint-arwaky-cli check . 2>&1)
          exit_code=$?
          violations=$(echo "$output" | grep -oP 'Total:\s*\K\d+')
          if [ -z "$violations" ]; then
            echo "::error::could not parse a violation count from check . output"
            echo "$output"
            exit 1
          fi
          echo "Violations: ${violations}"
          if [ "$exit_code" -ne 0 ]; then
            echo "::error::lint-arwaky-cli check . exited with code ${exit_code}"
            exit 1
          fi
          [ "${violations}" = "0" ]

      - name: AES Codes Check
        # Threshold must match the reconciled scan-visible rule count in
        # TEST.md §3.1/§3.2 exactly: 32 total AES rules (per-rule matrix) minus
        # 5 doc-only invariants (AES601–AES605, audited via `docs`, not `scan`)
        # = 27 unique codes expected from `scan workspaces-bad`.
        # When rules are added/removed, update this threshold and TEST.md §3.2
        # in lockstep (QA #636).
        run: |
          codes=$(./target/debug/lint-arwaky-cli scan workspaces-bad 2>&1 | grep -oP "AES\d+" | sort -u | wc -l)
          echo "Unique codes: ${codes:-0}"
          [ "${codes:-0}" -ge 27 ]

      - name: External Tool Integration Check (QA #637)
        # Proves the external-lint adapters actually invoked the real tools
        # installed above: at least one tool-native (non-AES) violation code
        # must appear for both the Python and the JS/TS bad workspaces.
        run: |
          py_out=$(./target/debug/lint-arwaky-cli scan workspaces-bad/modules 2>&1 || true)
          ts_out=$(./target/debug/lint-arwaky-cli scan workspaces-bad/packages 2>&1 || true)
          py_native=$(echo "$py_out" | grep -oE "(ruff|mypy|bandit)::[A-Za-z0-9_.-]+" | sort -u | wc -l)
          ts_native=$(echo "$ts_out" | grep -oE "(eslint|prettier|tsc)::[A-Za-z0-9_./-]+" | sort -u | wc -l)
          echo "Tool-native codes — Python: ${py_native}, JS/TS: ${ts_native}"
          if [ "${py_native}" -lt 1 ] || [ "${ts_native}" -lt 1 ]; then
            echo "::error::no tool-native violation codes found — external adapters did not run end-to-end"
            exit 1
          fi

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1 stable
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@fd09ccbe70d174f3c26b2fa0588e8c07a7bf4f7e # v2.37.0
        with:
          tool: cargo-audit,cargo-deny
      - name: Run cargo-audit
        run: cargo audit
      # Advisory policy is enforced here alongside cargo-audit. License, ban,
      # and source sections remain a reviewed local policy until their existing
      # warning baseline can be made CI-blocking without unrelated failures.
      - name: Enforce cargo-deny advisory policy
        # This job does not install sccache, so clear the workflow-wide wrapper
        # before cargo-deny invokes `cargo metadata`/`rustc -vV`.
        env:
          RUSTC_WRAPPER: ""
        run: cargo deny check advisories

  # QA #643: makes the test-coverage percentage computable and visible in CI
  # output (summary printed in the job log). See TEST.md §3.5 for thresholds.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1 stable
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov + cargo-nextest
        uses: taiki-e/install-action@fd09ccbe70d174f3c26b2fa0588e8c07a7bf4f7e # v2.37.0
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Compute coverage summary
        run: cargo llvm-cov nextest --workspace --lib --tests --summary-only
