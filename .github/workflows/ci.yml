name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  RUST_MIN_STACK: 33554432
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "false"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1 stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  doc-consistency:
    name: Doc Consistency
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cross-document consistency gate
        run: python3 tools/check_doc_consistency.py

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1 stable
        with:
          components: clippy
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --all-targets -- -D warnings

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1 stable
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1 stable
      - name: Install mold + nextest
        run: |
          sudo apt-get update && sudo apt-get install -y mold
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ~/.cargo/bin
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build release binary (for regression tests)
        run: cargo build --release

      - name: Run tests
        run: cargo nextest run --workspace --lib --tests -j 2

  self-lint:
    name: Self-Lint
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1 stable
      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build CLI
        run: cargo build --bin lint-arwaky-cli

      - name: AES Self-Lint
        run: |
          output=$(./target/debug/lint-arwaky-cli check . 2>&1)
          violations=$(echo "$output" | grep -oP 'Total:\s*\K\d+' || echo "0")
          echo "Violations: ${violations}"
          [ "${violations}" = "0" ]

      - name: AES Codes Check
        run: |
          codes=$(./target/debug/lint-arwaky-cli scan workspaces-bad 2>&1 | grep -oP "AES\d+" | sort -u | wc -l)
          echo "Unique codes: ${codes:-0}"
          [ "${codes:-0}" -ge 24 ]

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1 stable
      - name: Install cargo-audit and cargo-deny
        uses: taiki-e/install-action@fd09ccbe70d174f3c26b2fa0588e8c07a7bf4f7e # v2.37.0
        with:
          tool: cargo-audit,cargo-deny
      - name: Run cargo-audit
        run: cargo audit
      # Advisory policy is enforced here alongside cargo-audit. License, ban,
      # and source sections remain a reviewed local policy until their existing
      # warning baseline can be made CI-blocking without unrelated failures.
      - name: Diagnose cargo-deny advisory policy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if ! cargo deny check advisories > cargo-deny.log 2>&1; then
            gh pr comment "$PR_NUMBER" --body-file cargo-deny.log
            exit 1
          fi
