name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  RUST_MIN_STACK: 33554432
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "false"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1 stable
        with:
          components: rustfmt
      - name: Apply formatting
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "style: format Rust sources"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1 stable
        with:
          components: clippy
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo clippy --all-targets -- -D warnings

  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1 stable
      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1 stable
      - name: Install mold + nextest
        run: |
          sudo apt-get update && sudo apt-get install -y mold
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C ~/.cargo/bin
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build release binary (for regression tests)
        run: cargo build --release

      - name: Run tests
        run: |
          set -o pipefail
          cargo nextest run --workspace --lib --tests -j 2 2>&1 | tee /tmp/nextest.log
      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-log
          path: /tmp/nextest.log
      - name: Publish test diagnostics
        if: always()
        run: |
          tail -200 /tmp/nextest.log >> "$GITHUB_STEP_SUMMARY"
          branch="${{ github.event.pull_request.head.ref }}"
          git fetch origin "$branch"
          git reset --hard FETCH_HEAD
          cp /tmp/nextest.log .ci-nextest.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-nextest.log
          git commit -m "chore: capture nextest diagnostics" || true
          git push origin "HEAD:$branch" || true

  self-lint:
    name: Self-Lint
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1 stable
      - name: Install mold
        run: sudo apt-get update && sudo apt-get install -y mold
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build CLI
        run: cargo build --bin lint-arwaky-cli

      - name: AES Self-Lint
        run: |
          set -o pipefail
          ./target/debug/lint-arwaky-cli check . 2>&1 | tee /tmp/self-lint.log
          output=$(cat /tmp/self-lint.log)
          violations=$(echo "$output" | grep -oP 'Total:\s*\K\d+' || echo "0")
          echo "Violations: ${violations}"
          [ "${violations}" = "0" ]
      - name: Upload self-lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-lint-log
          path: /tmp/self-lint.log
      - name: Publish self-lint diagnostics
        if: always()
        run: |
          tail -200 /tmp/self-lint.log >> "$GITHUB_STEP_SUMMARY"
          branch="${{ github.event.pull_request.head.ref }}"
          git fetch origin "$branch"
          git reset --hard FETCH_HEAD
          cp /tmp/self-lint.log .ci-self-lint.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci-self-lint.log
          git commit -m "chore: capture self-lint diagnostics" || true
          git push origin "HEAD:$branch" || true

      - name: AES Codes Check
        run: |
          codes=$(./target/debug/lint-arwaky-cli scan workspaces-bad 2>&1 | grep -oP "AES\d+" | sort -u | wc -l)
          echo "Unique codes: ${codes:-0}"
          [ "${codes:-0}" -ge 24 ]

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1 stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@fd09ccbe70d174f3c26b2fa0588e8c07a7bf4f7e # v2.37.0 cargo-audit
      - name: Run cargo-audit
        run: cargo audit
