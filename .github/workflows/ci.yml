name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  RUST_MIN_STACK: 33554432
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "false"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1 stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

