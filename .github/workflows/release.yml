name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Allows the release-tag workflow to dispatch the release build after
  # creating the tag (GITHUB_TOKEN tag pushes do not trigger workflows).
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 1
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

jobs:
  build:
    name: Build release binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1 stable

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache cargo (release)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/release
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build release binaries
        run: cargo build --release --bin lint-arwaky-cli --bin lint-arwaky-mcp

      - name: Strip binaries
        run: strip target/release/lint-arwaky-cli target/release/lint-arwaky-mcp

      - name: Copy binaries
        run: |
          cp target/release/lint-arwaky-cli lint-arwaky-cli
          cp target/release/lint-arwaky-mcp lint-arwaky-mcp

      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: |
            lint-arwaky-cli
            lint-arwaky-mcp

  smoke-test:
    name: Smoke test binaries
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: binaries

      - run: chmod +x lint-arwaky-cli lint-arwaky-mcp

      - name: Verify CLI
        run: |
          ./lint-arwaky-cli --version
          ./lint-arwaky-cli --help

      - name: Verify MCP server
        run: ./lint-arwaky-mcp --version || true

      - name: Smoke scan
        run: ./lint-arwaky-cli report . --output-format json | grep '"score"'

  provenance:
    name: Generate SLSA provenance
    runs-on: ubuntu-latest
    needs: build
    permissions:
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: release-assets

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "release-assets/*"

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [smoke-test, provenance]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: binaries

      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            lint-arwaky-cli
            lint-arwaky-mcp
          generate_release_notes: true
