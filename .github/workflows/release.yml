name: Release

# Single self-contained release workflow. It replaces the former
# auto-release.yml + release-tag.yml trio and owns the whole release
# lifecycle, with no cross-workflow dispatch.
#
# Two entry points:
#
# 1. workflow_dispatch: compute the next SemVer version from the last
#    vX.Y.Z tag, stamp the version (scripts/bump.sh), generate the changelog
#    entry, commit on a release/vX.Y.Z branch and open a PR into main with
#    the `release` label. The run stops there; it does not tag or publish.
#    Release PRs are merged manually (or via Mergify's queue) once the
#    required checks pass.
#
# 2. pull_request closed (the release PR was merged into main): the
#    `create-tag` job derives vX.Y.Z from the merge commit subject and
#    pushes the tag. That tag push re-triggers this workflow through
#    `push.tags` and drives the publish path below. When BOT_RELEASE_TOKEN
#    is absent the tag push uses GITHUB_TOKEN and does NOT trigger other
#    workflows; Risa then dispatches the build manually.
#
# 3. push tags 'v*': build -> smoke-test -> provenance -> draft GitHub
#    Release. Test shards run in ci.yml and gate PR merges via the
#    GitHub ruleset; a tag only exists after CI has already passed.
#
# Mergify note: after the Mergify config migration (PR #1463) the
# `release` job in this workflow produces a DRAFT release. The draft is
# undrafted by `gh release edit` as part of the release lane; Mergify's
# merge queue does not cover the release-PR path, so Risa merges release
# PRs manually (or with `@mergifyio queue` when the check gate is green).

on:
  push:
    tags:
      - "v*"
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump type: patch | minor | major"
        required: false
        type: string
        default: "patch"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # sccache does not work with incremental compilation; keep it off so the
  # sccache action provides the caching.
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

jobs:
  # ---------------------------------------------------------------------------
  # Path 2: watch for the merged release PR on main and push the vX.Y.Z tag.
  # ---------------------------------------------------------------------------
  create-tag:
    name: Create release tag
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      contains(github.event.pull_request.labels.*.name, 'release') &&
      startsWith(github.event.pull_request.title, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create and push release tag
        env:
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          GITHUB_TOKEN: ${{ secrets.BOT_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          version=$(git log -1 --format=%s "$MERGE_SHA" | sed -E 's/^chore\(release\): v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/' | xargs)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version from merge commit: ${version}"
            exit 1
          fi
          tag="v${version}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists."
          else
            git tag "$tag" "$MERGE_SHA"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$tag"
          fi

  # ---------------------------------------------------------------------------
  # Path 1: workflow_dispatch bumps the version and opens a release PR to main.
  # ---------------------------------------------------------------------------
  prepare-release:
    name: Open release PR
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1 stable

      - name: Determine next semantic version
        id: version
        run: |
          BUMP="${{ inputs.bump }}"
          case "$BUMP" in
            major|minor|patch)
              # Delegate to the repo's own bump script; it stamps Cargo.toml,
              # VERSION, Cargo.lock, README and inserts the CHANGELOG entry.
              bash scripts/bump.sh "$BUMP" --no-changelog --no-commit
              NEW_VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)".*/\1/')
              ;;
            *)
              NEW_VERSION="$BUMP"
              bash scripts/bump.sh "$NEW_VERSION" --no-changelog --no-commit
              ;;
          esac
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${NEW_VERSION}"

      - name: Commit version bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git add Cargo.toml VERSION Cargo.lock README.md CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): v${VERSION}"

      - name: Open release PR
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="release/v${VERSION}"
          if gh pr list --head "$branch" --state open --json number --jq 'length' | grep -q '[1-9]'; then
            echo "Release PR ${branch} is already open; skipping duplicate."
            exit 0
          fi
          git switch -c "$branch"
          git push -u origin "$branch" --force-with-lease
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore(release): v${VERSION}" \
            --label release \
            --body "Automated semantic release PR for v${VERSION}. On merge, the \`create-tag\` job pushes the \`v${VERSION}\` tag, which triggers the build and publish jobs in this workflow."

  # ---------------------------------------------------------------------------
  # Build + publish path (push tag 'vX.Y.Z').
  # ---------------------------------------------------------------------------
  build:
    name: Build release binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # v1 stable

      - name: Install mold linker
        run: sudo apt-get update && sudo apt-get install -y mold

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache cargo (release)
        uses: actions/cache@v6
        with:
          # sccache (above) handles compilation caching; only registry/git
          # index caches are worthwhile here.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Build release binaries
        run: cargo build --release --bin lint-arwaky-cli --bin lint-arwaky-mcp

      - name: Strip binaries
        run: strip target/release/lint-arwaky-cli target/release/lint-arwaky-mcp

      - name: Copy binaries
        run: |
          cp target/release/lint-arwaky-cli lint-arwaky-cli
          cp target/release/lint-arwaky-mcp lint-arwaky-mcp

      # `lint-arwaky-cli update` verifies the downloaded binary against this
      # checksum before replacing the running executable.
      - name: Generate checksums
        run: sha256sum lint-arwaky-cli lint-arwaky-mcp > lint-arwaky-cli.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: |
            lint-arwaky-cli
            lint-arwaky-mcp
            lint-arwaky-cli.sha256

  smoke-test:
    name: Smoke test binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: binaries

      - run: chmod +x lint-arwaky-cli lint-arwaky-mcp

      - name: Verify CLI
        run: |
          ./lint-arwaky-cli --version
          ./lint-arwaky-cli --help

      - name: Verify the binary reports the tagged version
        # Guards the release version against drifting back to whichever crate
        # holds the printing code: `la --version` and the scan header must both
        # agree with the VERSION file the tag was cut from.
        run: |
          version="${GITHUB_REF_NAME#v}"
          reported="$(./lint-arwaky-cli --version | awk '{print $NF}')"
          if [ "$reported" != "$version" ]; then
            echo "Binary reports $reported but the tag is $version" >&2
            exit 1
          fi

      - name: Verify MCP server
        run: ./lint-arwaky-mcp --version || true

      - name: Smoke scan
        # The scan JSON carries `results` and `target`; assert the shape and
        # that it parses, so a renamed or reshaped payload fails here rather
        # than in a consumer. `scan` exits non-zero when violations are found;
        # that is Self-Lint's job to assert, not this smoke check's.
        run: |
          exit_code=0
          ./lint-arwaky-cli scan . --format json > scan.json || exit_code=$?
          if [ "$exit_code" -ne 0 ] && [ ! -s scan.json ]; then
            echo "::error::scan exited ${exit_code} without producing output"
            exit 1
          fi
          python3 - <<'PY'
          import json, sys

          with open("scan.json") as handle:
              payload = json.load(handle)

          missing = {"results", "target"} - set(payload)
          if missing:
              sys.exit(f"scan JSON is missing {sorted(missing)}; got {list(payload)}")
          if not isinstance(payload["results"], list):
              sys.exit("scan JSON 'results' is not a list")
          print(f"scan JSON ok: {len(payload['results'])} results, target={payload['target']}")
          PY

  provenance:
    name: Generate SLSA provenance
    if: startsWith(github.ref, 'refs/tags/v') && github.repository_visibility == 'public'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      attestations: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: release-assets

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "release-assets/*"

  release:
    name: Create GitHub Release (draft)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [smoke-test]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: binaries

      # Hardening for PE-5-03 (#631): a prior release (v3.7.0) shipped without
      # the .sha256 asset even though this job's `files:` list already expected
      # it. Fail loudly instead of silently publishing a release that is
      # missing an expected asset.
      - name: Verify expected assets present
        run: |
          for f in lint-arwaky-cli lint-arwaky-mcp lint-arwaky-cli.sha256; do
            test -f "$f" || { echo "::error::missing expected release asset: $f"; exit 1; }
          done

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            lint-arwaky-cli
            lint-arwaky-mcp
            lint-arwaky-cli.sha256
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
