name: Dependency Hygiene

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-hygiene-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-machete:
    name: Unused dependency advisory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: taiki-e/install-action@fd09ccbe70d174f3c26b2fa0588e8c07a7bf4f7e
        with:
          tool: cargo-machete

      # Advisory by design (issue #579): findings surface as review
      # annotations and in the step summary; they never block the merge.
      - name: Report unused dependencies
        run: |
          set +e
          findings=$(cargo machete 2>&1)
          status=$?
          echo "$findings" | tee machete.log
          echo '## cargo-machete advisory report' >> "$GITHUB_STEP_SUMMARY"
          echo 'Unused dependencies are reported for cleanup; this job is advisory and does not block the merge (issue #579).' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "$findings" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$findings" | grep -E '^[a-zA-Z0-9_-]+:$|^[[:space:]]+[a-zA-Z0-9_-]+$' | \
            while IFS= read -r line; do
              line=$(echo "$line" | sed 's/^[[:space:]]*//' | tr -d ':')
              if [ -n "$line" ]; then
                echo "::warning title=cargo-machete::unused dependency reported: ${line}"
              fi
            done
          if [ "$status" -ne 0 ]; then
            echo "cargo-machete exited ${status}; findings are advisory (issue #579)." >> "$GITHUB_STEP_SUMMARY"
            cat machete.log
          fi
          exit 0
