# GitHub Labeler configuration (v7 format).
# Labels are applied to PRs based on which files they change.

# Rust
rust:
  - changed-files:
      - any-glob-to-any-file: crates/**/*.rs
      - any-glob-to-any-file: crates/**/Cargo.toml
      - any-glob-to-any-file: crates/**/Cargo.lock

# Python
python:
  - changed-files:
      - any-glob-to-any-file: modules/**/*.py
      - any-glob-to-any-file: modules/**/pyproject.toml
      - any-glob-to-any-file: modules/**/requirements.txt

# TypeScript / JavaScript
typescript:
  - changed-files:
      - any-glob-to-any-file: packages/**/*.ts
      - any-glob-to-any-file: packages/**/*.tsx
      - any-glob-to-any-file: packages/**/package.json

# CI / Workflows
ci:
  - changed-files:
      - any-glob-to-any-file: .github/workflows/**
      - any-glob-to-any-file: .github/dependabot.yml

# Documentation
documentation:
  - changed-files:
      - any-glob-to-any-file: "**/*.md"

# Configuration
configuration:
  - changed-files:
      - any-glob-to-any-file: "*.yaml"
      - any-glob-to-any-file: "*.yml"
      - any-glob-to-any-file: .codacy.yaml
      - any-glob-to-any-file: .repowise/**
      - any-glob-to-any-file: lint_arwaky.config.yaml

# Dependencies
dependencies:
  - changed-files:
      - any-glob-to-any-file: "**/Cargo.toml"
      - any-glob-to-any-file: "**/Cargo.lock"
      - any-glob-to-any-file: "**/package.json"
      - any-glob-to-any-file: "**/requirements.txt"

# Tests
tests:
  - changed-files:
      - any-glob-to-any-file: crates/**/tests/**
      - any-glob-to-any-file: modules/**/tests/**
      - any-glob-to-any-file: packages/**/tests/**

# Fixtures (test workspaces)
fixtures:
  - changed-files:
      - any-glob-to-any-file: workspaces-bad/**
      - any-glob-to-any-file: workspaces-good/**
