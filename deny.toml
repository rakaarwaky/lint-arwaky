# cargo-deny configuration
# See: https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
# A stale `ignore` entry that no longer matches any crate in the lock must not
# hard-fail the advisory gate; report it as a warning so the entry can be
# cleaned up, but don't block the release on it.
unused-ignored-advisory = "warn"
unmaintained = "all"
ignore = [
    # paste is unmaintained but only a transitive dep via ratatui; no direct usage.
    # Upstream issue: https://github.com/dtolnay/paste
    "RUSTSEC-2024-0436",
    # DNS rebinding affects rmcp's Streamable HTTP server transport. We lock
    # rmcp 3.5.0 and construct only rmcp::transport::stdio in
    # crates/root_mcp_main_entry.rs. Re-review if HTTP/SSE transport is added.
    "RUSTSEC-2026-0189",
    # unsafe-libyaml is unmaintained (archived) but only a transitive dep via
    # serde_yaml_ng (YAML config parsing); no safe upstream replacement.
    # Re-review if a safe YAML parser (saphyr/serde-saphyr) replaces it.
    "RUSTSEC-2024-0449",
    # bincode is unmaintained (team ceased development; 1.3.3 is the final
    # version). It is a transitive dep via syntect -> comrak -> shared-common
    # (markdown rendering for doc checks); no safe upgrade available.
    # Upstream advisory: https://rustsec.org/advisories/RUSTSEC-2025-0141
    "RUSTSEC-2025-0141",
    # yaml-rust is unmaintained (maintainer unreachable since 2024). It is a
    # transitive dep via syntect -> comrak -> shared-common (markdown rendering
    # for doc checks); consider switching to yaml-rust2 if syntect adds it.
    # Upstream advisory: https://rustsec.org/advisories/RUSTSEC-2024-0320
    "RUSTSEC-2024-0320",
]
yanked = "warn"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
