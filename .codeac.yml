# Codeac config — excludes paths the analyzer should skip.
# Docs: https://www.codeac.io/documentation/custom-configuration.html
# Excludes use glob syntax; a trailing ** matches everything inside.
# workspaces-bad / workspaces-good are intentional fixtures, not product code.
exclude:
  # Fixtures (intentional violations, not real code)
  - "workspaces-bad/**"
  - "workspaces-good/**"

  # Build output
  - "target/**"
  - "dist/**"
  - "build/**"
  - "node_modules/**"

  # Per-crate test suites in the main workspace
  - "crates/*/tests/**"
