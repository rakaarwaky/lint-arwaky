# Codeac Cloud config — per-repo behaviour overrides.
# Docs: https://www.codeac.io/documentation/custom-configuration.html
#
# `.codeac.yml` accepts only `version`, `thresholds`, and `tools` sections.
# `tools.<name>` supports an `enabled` boolean per linter; Codeac's default
# config has every tool enabled.
#
# File-level exclusions are delegated to each linter's own config file,
# read from the repo root:
#   ESLint     — .eslintignore
#   Pylint     — .pylintrc
#   RuboCop    — .rubocop.yml
#   jscpd      — .jscpd.json
#   …etc.
#
# This repo's ESLint ignore list lives in .eslintignore (same paths as
# .codacy.yaml / .codacy/codacy.yaml exclude_paths). No `enabled: false`
# override is needed — Codeac's tool auto-detection handles language
# filtering.

version: '1'
