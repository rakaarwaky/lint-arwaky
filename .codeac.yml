# Codeac Cloud config — per-repo behaviour overrides.
# Docs: https://www.codeac.io/documentation/custom-configuration.html
#
# `.codeac.yml` supports only `version`, `thresholds`, and `tools` sections.
# Folder / path exclusions are configured in the Codeac Cloud dashboard
# (Settings → Ignore paths) — they are not read from this file.
#
# To stop Codeac reporting violations from fixture / build folders, add the
# following ignore paths in the dashboard:
#   workspaces-bad/**
#   workspaces-good/**
#   target/**
#   dist/**
#   build/**
#   node_modules/**
#   crates/*/tests/**

version: '1'
