[package]
name = "naming-rules-lint-arwaky"
version = "3.7.1"
edition = "2024"
description = "Naming-convention enforcer for AES101 (stem shape), AES102 (layer suffix), and AES103 (test/bench file prefix)."
license = "MIT"
repository = "https://github.com/rakaarwaky/lint-arwaky"
publish = true

[lints]
workspace = true

[dependencies]
shared-common.workspace = true
shared-config-system.workspace = true
shared-filesystem.workspace = true
shared-naming-rules.workspace = true
regex.workspace = true
rayon.workspace = true

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3"
filesystem.workspace = true

[[bench]]
name = "bench_naming_rules"
path = "benches/bench_naming_rules.rs"
harness = false
