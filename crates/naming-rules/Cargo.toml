[package]
name = "naming-rules-lint-arwaky"
version = "3.6.0"
edition = "2024"
description = "Naming-convention enforcer for AES101 and AES102."
license = "MIT"
repository = "https://github.com/rakaarwaky/lint-arwaky"
publish = true

[lints]
workspace = true

[dependencies]
shared.workspace = true
regex.workspace = true
rayon.workspace = true

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3"
filesystem.workspace = true

[[bench]]
name = "bench_naming_rules"
path = "benches/bench_naming_rules.rs"
harness = false
