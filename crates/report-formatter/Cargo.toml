[package]
name = "report-formatter-lint-arwaky"
version = "2.0.0"
edition = "2024"
description = "Report formatting capabilities (text, JSON, SARIF, JUnit) implementing IReportFormatterProtocol."
license = "MIT"
repository = "https://github.com/rakaarwaky/lint-arwaky"
publish = true

[lints]
workspace = true

[dependencies]
shared.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "bench_report_formatter"
path = "benches/bench_report_formatter.rs"
harness = false
