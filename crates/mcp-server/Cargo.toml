[package]
name = "mcp-server-lint-arwaky"
version.workspace = true
edition = "2024"
description = "MCP server surface for lint-arwaky."
license = "MIT"

[dependencies]
shared-auto-fix.workspace = true
shared-cli-commands.workspace = true
shared-common.workspace = true
shared-config-system.workspace = true
shared-doc-rules.workspace = true
shared-external-lint.workspace = true
shared-filesystem.workspace = true
shared-git-hooks.workspace = true
shared-import-rules.workspace = true
shared-maintenance.workspace = true
shared-naming-rules.workspace = true
shared-orphan-rules.workspace = true
shared-project-setup.workspace = true
shared-quality-rules.workspace = true
shared-role-rules.workspace = true
shared-structure-rules.workspace = true
dispatcher = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rmcp = { workspace = true }
# Direct dependency required by the `JsonSchema` derive: `rmcp` re-exports the
# trait for the `use`, but the derive expands to `::schemars::…` paths.
schemars = { workspace = true }
dirs = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3"
config-system.workspace = true
filesystem.workspace = true

[[bench]]
name = "bench_mcp_server"
path = "benches/bench_mcp_server.rs"
harness = false
