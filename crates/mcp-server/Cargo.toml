[package]
name = "mcp-server-lint-arwaky"
version = "2.0.0"
edition = "2024"
description = "MCP server surface for lint-arwaky."
license = "MIT"

[dependencies]
shared = { workspace = true }
dispatcher = { workspace = true }
serde_json = { workspace = true }
rmcp = { workspace = true }
dirs = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "bench_mcp_server"
path = "benches/bench_mcp_server.rs"
harness = false
