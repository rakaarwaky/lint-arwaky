[package]
name = "filesystem-lint-arwaky"
version = "1.11.0"
edition = "2024"
description = "Centralized file I/O, AST parsing, and dependency graph construction for lint-arwaky."
license = "MIT"
repository = "https://github.com/rakaarwaky/lint-arwaky"
publish = true

[lints]
workspace = true

[dependencies]
ignore = "0.4"

# AST parsing
tree-sitter = "0.26.11"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25.0"

# Parallel processing
rayon = "1.12.0"

# Dependency graph
petgraph = "0.8.3"

# Concurrent collections
dashmap = "6.2.1"

# Path handling
camino = "1.2.5"

# Error handling
anyhow = "1.0.104"

# Shared types
shared.workspace = true

[dev-dependencies]
tempfile = "3"
