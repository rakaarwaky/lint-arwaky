[package]
name = "auto-fix-lint-arwaky"
version = "1.11.0"
edition = "2024"
description = "Auto-fix processor that applies mechanical corrections for AES rule violations."
license = "MIT"

[lints]
workspace = true

[dependencies]
shared = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
quality-rules = { workspace = true }
filesystem = { workspace = true }
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "bench_auto_fix"
path = "benches/bench_auto_fix.rs"
harness = false
