[package]
name = "file-watch-lint-arwaky"
version = "1.11.0"
edition = "2024"
description = "File-watch feature crate — real-time file change detection and incremental lint pipeline."
license = "MIT"

[lints]
workspace = true

[features]
watch = []

[dependencies]
shared.workspace = true
notify.workspace = true
notify-debouncer-mini.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true

[dev-dependencies]
quality-rules = { workspace = true }
filesystem = { workspace = true }
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "bench_file_watch"
path = "benches/bench_file_watch.rs"
harness = false
