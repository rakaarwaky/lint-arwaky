# ═══════════════════════════════════════════════════════════════════════
# lint_arwaky.config.yaml — Unified configuration for all languages
# Replaces: lint_arwaky.config.rust.yaml, lint_arwaky.config.python.yaml,
#           lint_arwaky.config.typescript.yaml, lint_arwaky.config.javascript.yaml
# ═══════════════════════════════════════════════════════════════════════

thresholds:
  score: 100.0
  complexity: 15

# ─── Adapters ─────────────────────────────────────────────────────────
# All adapters listed. The system auto-filters by detected language.
adapters:
  # Rust
  - name: "clippy"
    weight: 1.0
  - name: "rustfmt"
    weight: 1.0
  - name: "cargo-audit"
    weight: 1.0
  # Python
  - name: "ruff"
    weight: 1.0
  - name: "mypy"
    weight: 1.0
  - name: "bandit"
    weight: 1.0
  # TypeScript/JavaScript
  - name: "eslint"
    weight: 1.0
  - name: "tsc"
    weight: 1.0
  - name: "prettier"
    weight: 1.0
  # Markdown — needs `markdownlint-cli2` (or `markdownlint-cli`) on PATH.
  - name: "markdownlint"
    weight: 1.0
  # Internal
  - name: "architecture"
    weight: 3.0

ignored_rules:
  # Rule-level suppressions, applied to every linter's findings. Matched as a
  # case-insensitive substring of the violation code: a bare `MD013` silences
  # every adapter's MD013, `AES2` silences a whole AES range.
  #
  # External-tool rules go here too, which is why this file needs no per-tool
  # companion config: a project's markdownlint policy is the `markdownlint::`
  # entries below. Add `markdownlint` to `adapters:` above to switch the adapter
  # on, then silence individual rules by their reported code:
  #   ignored_rules:
  #     - "markdownlint::MD013"
  #
  # Off by default, because most projects write documentation the way this
  # tool's own docs are written:
  #   MD013 line-length - spec tables carry a full rule code, a path and a
  #     command on one row so each table stays scannable as a single unit.
  #   MD060 table-column-style - tables are written compact (pipes tight
  #     against the cell text), not column-aligned.
  #   MD033 inline HTML - `<Type>` is Rust/TS generic notation in prose and
  #     code spans, not markup.
  #   MD024 duplicate heading - per-layer Purpose/Components sections and
  #     per-version CHANGELOG entries repeat headings on purpose.
  #
  # The structural rules (MD012, MD022, MD031, MD032, MD040, MD047, MD056,
  # MD058) deliberately stay enabled - they catch malformed tables and
  # unlabelled code fences, which have surfaced real defects.
  - "markdownlint::MD013"
  - "markdownlint::MD060"
  - "markdownlint::MD033"
  - "markdownlint::MD024"

ignored_paths: []

# ─── Architecture rules ─────────────────────────────────────────────────
#
# The AES business rules — layer scopes, the import dependency matrix, suffix
# policies, code-quality limits — are fixed in the tool, not configurable. They
# live in `crates/shared/src/config_system/utility_architecture_constants.rs` and
# are compiled into the binary, so every project enforces the same architecture.
#
# This section carries only what a project may change: whether a rule runs and
# which files it skips.
architecture:
  enabled: true
  rules:
    # ─── AES100 ───
    AES101:
      enabled: true
      exceptions: []
    AES102:
      enabled: true
      exceptions: []
