[package]
name = "shared-naming-rules-lint-arwaky"
version.workspace = true
edition = "2024"
description = "AES naming rules foundation: taxonomy (`_vo`, `_entity`, `_event`, `_error`, `_constant`), contract (`_port`, `_protocol`, `_aggregate`), and utility types shared across lint-arwaky. Split out of `shared-lint-arwaky`."
license = "MIT"
repository = "https://github.com/rakaarwaky/lint-arwaky"
publish = true

# The folder *is* the crate root, so the manifest lives beside `mod.rs`.
[lib]
path = "mod.rs"

[lints]
workspace = true

[dependencies]
shared-common.workspace = true
shared-config-system.workspace = true
shared-filesystem.workspace = true
# none — pure leaf
