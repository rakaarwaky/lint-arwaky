[package]
name = "shared-supervisor-lint-arwaky"
version.workspace = true
edition = "2024"
description = "AES supervisor foundation: taxonomy (`_vo`, `_error`) and contract (`_protocol`) types shared across lint-arwaky. Split out of `shared-lint-arwaky`."
license = "MIT"
repository = "https://github.com/rakaarwaky/lint-arwaky"
publish = true

# The folder *is* the crate root, so the manifest lives beside `mod.rs`.
[lib]
path = "mod.rs"

[lints]
workspace = true

[dependencies]
shared-common.workspace = true
serde.workspace = true
thiserror.workspace = true
