[package]
name = "shared-doc-rules-lint-arwaky"
version = "0.1.0"
edition = "2024"
description = "AES doc rules foundation: taxonomy (`_vo`, `_entity`, `_event`, `_error`, `_constant`), contract (`_port`, `_protocol`, `_aggregate`), and utility types shared across lint-arwaky. Split out of `shared-lint-arwaky`."
license = "MIT"
repository = "https://github.com/rakaarwaky/lint-arwaky"
publish = true

# The folder *is* the crate root, so the manifest lives beside `mod.rs`.
[lib]
path = "mod.rs"

[lints]
workspace = true

[dependencies]
shared-common.workspace = true
serde.workspace = true
regex.workspace = true
