[package]
name = "shared-structure-rules-lint-arwaky"
version = "3.7.1"
edition = "2024"
description = "AES structure rules foundation: taxonomy (`_vo`, `_entity`, `_event`, `_error`, `_constant`), contract (`_port`, `_protocol`, `_aggregate`), and utility types shared across lint-arwaky. Split out of `shared-lint-arwaky`."
license = "MIT"
repository = "https://github.com/rakaarwaky/lint-arwaky"
publish = true

# The folder *is* the crate root, so the manifest lives beside `mod.rs`.
[lib]
path = "mod.rs"

[lints]
workspace = true

[dependencies]
# AES704 reads the test-type prefix vocabulary from the naming-rules shared
# foundation, so the structure rule and the AES103 naming rule cannot drift
# apart on which prefixes are legal. Pure data — no cycle: naming-rules does
# not depend on structure-rules.
shared-naming-rules.workspace = true
# #570: surface orchestrators (surface_*_action) moved in from crates/dispatcher.
shared-auto-fix.workspace = true
shared-cli-commands.workspace = true
shared-common.workspace = true
shared-config-system.workspace = true
shared-doc-rules.workspace = true
shared-external-lint.workspace = true
shared-file-watch.workspace = true
shared-filesystem.workspace = true
shared-git-hooks.workspace = true
shared-import-rules.workspace = true
shared-maintenance.workspace = true
shared-orphan-rules.workspace = true
shared-project-setup.workspace = true
shared-quality-rules.workspace = true
shared-role-rules.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
dirs = { workspace = true }
ctrlc = { workspace = true }
tracing = { workspace = true }
