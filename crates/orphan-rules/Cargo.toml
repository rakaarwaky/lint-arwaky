[package]
name = "orphan-rules-lint-arwaky"
version = "1.11.0"
edition = "2024"
description = "Unreachable/dead component detector covering AES501-AES506."
license = "MIT"
repository = "https://github.com/rakaarwaky/lint-arwaky"
publish = true

[lints]
workspace = true

[dependencies]
shared.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
regex.workspace = true
once_cell.workspace = true

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3"
filesystem-lint-arwaky.workspace = true
