[package]
name = "orphan-rules-lint-arwaky"
version = "0.1.0"
edition = "2024"
description = "Unreachable/dead component detector covering AES501-AES506."
license = "MIT"
repository = "https://github.com/rakaarwaky/lint-arwaky"
publish = true

[lints]
workspace = true

[dependencies]
shared-cli-commands.workspace = true
shared-common.workspace = true
shared-config-system.workspace = true
shared-filesystem.workspace = true
shared-orphan-rules.workspace = true
shared-quality-rules.workspace = true
shared-role-rules.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
regex.workspace = true
once_cell.workspace = true
tracing.workspace = true

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3"
filesystem.workspace = true

[[bench]]
name = "bench_orphan_rules"
path = "benches/bench_orphan_rules.rs"
harness = false
