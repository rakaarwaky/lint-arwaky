[package]
name = "quality-rules-lint-arwaky"
version = "3.6.0"
edition = "2024"
description = "Code-quality analyzers covering AES301–AES305."
license = "MIT"
repository = "https://github.com/rakaarwaky/lint-arwaky"
publish = true

[lints]
workspace = true

[dependencies]
shared.workspace = true
rayon.workspace = true

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3"
filesystem.workspace = true

[[bench]]
name = "bench_quality_rules"
path = "benches/bench_quality_rules.rs"
harness = false
