[package]
name = "structure-rules-lint-arwaky"
version.workspace = true
edition = "2024"
description = "Folder and file structure enforcer for AES701 (shared purity), AES702 (feature health), AES703 (surface purity), AES704 (test-suite coverage), AES705 (member-root placement), and AES706 (PR-id to crate-folder alignment)."
license = "MIT"
repository = "https://github.com/rakaarwaky/lint-arwaky"
publish = true

[lints]
workspace = true

[dependencies]
# AES704 labels test-suite paths with the same vocabulary AES103 enforces, so
# the naming rule and the structure rule cannot drift apart on the prefix list.
shared-naming-rules.workspace = true
shared-structure-rules.workspace = true
# MemberRole is shared with doc-rules so both classifiers mirror each other
# and cannot silently diverge on folder role.
shared-doc-rules.workspace = true

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "bench_structure_rules"
path = "benches/bench_structure_rules.rs"
harness = false
