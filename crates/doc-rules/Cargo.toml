[package]
name = "doc-rules-lint-arwaky"
version.workspace = true
edition = "2024"
description = "Structural invariants for the AES document chain (AES601–AES605)."
license = "MIT"
repository = "https://github.com/rakaarwaky/lint-arwaky"
publish = true

[lints]
workspace = true

[dependencies]
shared-common.workspace = true
shared-doc-rules.workspace = true
regex.workspace = true

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3"
serde_json.workspace = true

[[bench]]
name = "bench_doc_rules"
path = "benches/bench_doc_rules.rs"
harness = false
