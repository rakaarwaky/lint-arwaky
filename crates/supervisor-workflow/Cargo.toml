[package]
name = "supervisor-workflow-lint-arwaky"
version.workspace = true
edition = "2024"
description = "Supervisor workflow feature: GitHub issue selection + subagent delegation pipeline (mocked I/O)."
license = "MIT"
repository = "https://github.com/rakaarwaky/lint-arwaky"
publish = true

[lints]
workspace = true

[dependencies]
shared-common.workspace = true
shared-supervisor.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3"

[[bench]]
name = "bench_supervisor_workflow"
path = "benches/bench_supervisor_workflow.rs"
harness = false
