[package]
name = "maintenance-lint-arwaky"
version = "3.5.1"
edition = "2024"
description = "Maintenance features: doctor, stats, clean, update, security scan, dependency report."
license = "MIT"

[lints]
workspace = true

[dependencies]
shared = { workspace = true }
serde_json = { workspace = true }
tracing.workspace = true

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tempfile = "3"
filesystem.workspace = true

[[bench]]
name = "bench_maintenance"
path = "benches/bench_maintenance.rs"
harness = false
