# ═══════════════════════════════════════════════════════════════════════
# lint_arwaky.config.yaml — Unified configuration for all languages
# Replaces: lint_arwaky.config.rust.yaml, lint_arwaky.config.python.yaml,
#           lint_arwaky.config.typescript.yaml, lint_arwaky.config.javascript.yaml
# ═══════════════════════════════════════════════════════════════════════

thresholds:
  score: 100.0
  complexity: 15

# ─── Adapters ─────────────────────────────────────────────────────────
# All adapters listed. The system auto-filters by detected language.
adapters:
  # Rust
  - name: "clippy"
    weight: 1.0
  - name: "rustfmt"
    weight: 1.0
  - name: "cargo-audit"
    weight: 1.0
  # Python
  - name: "ruff"
    weight: 1.0
  - name: "mypy"
    weight: 1.0
  - name: "bandit"
    weight: 1.0
  # TypeScript/JavaScript
  - name: "eslint"
    weight: 1.0
  - name: "tsc"
    weight: 1.0
  - name: "prettier"
    weight: 1.0
  # Internal
  - name: "architecture"
    weight: 3.0

ignored_rules: []

ignored_paths: []

# ─── Architecture rules (superset, shared across all languages) ───────
architecture:
  enabled: true
  rules:
    # ─── AES100: Naming ───
    AES101:
      enabled: true
      scope:
        [
          "taxonomy",
          "utility",
          "contract",
          "capabilities",
          "agent",
          "surface",
          "root",
        ]
      exceptions: []

    AES102:
      enabled: true
      scope:
        [
          "taxonomy",
          "utility",
          "contract",
          "capabilities",
          "agent",
          "surface",
          "root",
        ]
      exceptions: []
      layers:
        taxonomy:
          suffix:
            - strict: ["vo", "entity", "error", "event", "constant", "request", "response"]
        contract:
          suffix:
            - strict: ["protocol", "aggregate"]
        utility:
          suffix:
            - flexible: []
            - forbidden:
                [
                  "vo",
                  "entity",
                  "error",
                  "event",
                  "constant",
                  "protocol",
                  "aggregate",
                  "request",
                  "response",
                ]
        capabilities:
          suffix:
            - flexible: []
            - forbidden:
                [
                  "vo",
                  "entity",
                  "error",
                  "event",
                  "constant",
                  "constants",
                  "protocol",
                  "aggregate",
                  "utility",
                  "request",
                  "response",
                ]
        agent:
          suffix:
            - strict: ["orchestrator"]
        surface:
          suffix:
            - strict:
                [
                  "command",
                  "controller",
                  "page",
                  "view",
                  "component",
                  "router",
                  "layout",
                  "hook",
                  "store",
                  "action",
                  "screen",
                ]
        root:
          suffix:
            - strict: ["entry", "container"]

    # ─── AES200: Import ───
    AES201:
      enabled: true
      scope:
        [
          "taxonomy",
          "utility",
          "contract",
          "capabilities",
          "agent",
          "surface",
          "root",
        ]
      exceptions: []
      conditions:
        - scope: "taxonomy(vo)"
          allowed: ["taxonomy"]
          mandatory: null
          forbidden:
            ["agent", "surface", "contract", "utility", "capabilities", "root"]

        - scope: "taxonomy(request,response)"
          allowed: ["taxonomy"]
          mandatory: null
          forbidden:
            ["agent", "surface", "contract", "utility", "capabilities", "root"]

        - scope: "taxonomy(entity,error,event)"
          allowed: ["taxonomy"]
          mandatory: ["taxonomy(vo|constant)"]
          forbidden:
            ["agent", "surface", "contract", "utility", "capabilities", "root"]

        - scope: "taxonomy(constant)"
          allowed: ["taxonomy"]
          mandatory: null
          forbidden:
            ["agent", "surface", "contract", "utility", "capabilities", "root"]

        - scope: "utility"
          allowed: ["taxonomy"]
          mandatory: null
          forbidden: ["agent", "surface", "contract", "capabilities", "root", "utility"]

        - scope: "contract(protocol)"
          allowed: ["taxonomy", "contract"]
          mandatory: ["taxonomy"]
          forbidden:
            ["agent", "surface", "capabilities", "contract(aggregate)", "root"]

        - scope: "contract(aggregate)"
          allowed: ["taxonomy", "contract"]
          mandatory: ["taxonomy"]
          forbidden: ["agent", "surface", "capabilities", "root"]
          forbidden_inheritance: ["contract(protocol)"]

        - scope: "capabilities"
          allowed: ["taxonomy", "contract", "utility"]
          mandatory: ["taxonomy", "contract(protocol)"]
          forbidden: ["surface", "agent", "capabilities", "root"]

        - scope: "agent(orchestrator)"
          allowed:
            ["taxonomy", "contract(aggregate)", "contract(protocol)", "utility"]
          mandatory: ["taxonomy", "contract(aggregate)"]
          forbidden: ["surface", "capabilities", "root"]

        - scope: "root"
          allowed: ["taxonomy", "contract", "capabilities", "agent", "surface"]
          mandatory: []
          forbidden: []

        - scope: "surface(command|controller|page)"
          allowed: ["taxonomy", "contract(aggregate)", "utility"]
          mandatory: null
          forbidden: ["agent", "capabilities", "contract(protocol)", "root"]

        - scope: "surface(hook|store|action|screen|router)"
          allowed: ["taxonomy"]
          mandatory: null
          forbidden:
            [
              "agent",
              "capabilities",
              "contract(protocol)",
              "surface(command|controller|page|entry)",
              "root",
            ]

        - scope: "surface(component|view|layout)"
          allowed: ["taxonomy"]
          mandatory: null
          forbidden:
            [
              "agent",
              "contract",
              "capabilities",
              "surface(command|controller|page|entry|hook|store|action|screen|router)",
              "root",
            ]

    AES202:
      enabled: true
      scope:
        [
          "taxonomy",
          "utility",
          "contract",
          "capabilities",
          "agent",
          "surface",
          "root",
        ]
      exceptions: []
      conditions:
        - scope: "taxonomy(vo)"
          allowed: ["taxonomy"]
          mandatory: null
          forbidden:
            ["agent", "surface", "contract", "utility", "capabilities", "root"]

        - scope: "taxonomy(request,response)"
          allowed: ["taxonomy"]
          mandatory: null
          forbidden:
            ["agent", "surface", "contract", "utility", "capabilities", "root"]

        - scope: "taxonomy(entity,error,event)"
          allowed: ["taxonomy"]
          mandatory: ["taxonomy(vo|constant)"]
          forbidden:
            ["agent", "surface", "contract", "utility", "capabilities", "root"]

        - scope: "taxonomy(constant)"
          allowed: ["taxonomy"]
          mandatory: null
          forbidden:
            ["agent", "surface", "contract", "utility", "capabilities", "root"]

        - scope: "utility"
          allowed: ["taxonomy"]
          mandatory: null
          forbidden: ["agent", "surface", "contract", "capabilities", "root", "utility"]

        - scope: "contract(protocol)"
          allowed: ["taxonomy", "contract"]
          mandatory: ["taxonomy"]
          forbidden:
            ["agent", "surface", "capabilities", "contract(aggregate)", "root"]

        - scope: "contract(aggregate)"
          allowed: ["taxonomy", "contract"]
          mandatory: ["taxonomy"]
          forbidden: ["agent", "surface", "capabilities", "root"]

        - scope: "capabilities"
          allowed: ["taxonomy", "contract", "utility"]
          mandatory: ["taxonomy", "contract(protocol)"]
          forbidden: ["surface", "agent", "capabilities", "root"]

        - scope: "agent(orchestrator)"
          allowed:
            ["taxonomy", "contract(aggregate)", "contract(protocol)", "utility"]
          mandatory: ["taxonomy", "contract(aggregate)"]
          forbidden: ["surface", "capabilities", "root"]

        - scope: "root"
          allowed: ["taxonomy", "contract", "capabilities", "agent", "surface"]
          mandatory: []
          forbidden: []

        - scope: "surface(command|controller|page)"
          allowed: ["taxonomy", "contract(aggregate)", "utility"]
          mandatory: null
          forbidden: ["agent", "capabilities", "contract(protocol)", "root"]

        - scope: "surface(hook|store|action|screen|router)"
          allowed: ["taxonomy"]
          mandatory: null
          forbidden:
            [
              "agent",
              "capabilities",
              "contract(protocol)",
              "surface(command|controller|page|entry)",
              "root",
            ]

        - scope: "surface(component|view|layout)"
          allowed: ["taxonomy"]
          mandatory: null
          forbidden:
            [
              "agent",
              "contract",
              "capabilities",
              "surface(command|controller|page|entry|hook|store|action|screen|router)",
              "root",
            ]

    AES203:
      enabled: true
      scope:
        ["taxonomy", "contract", "utility", "capabilities", "agent", "surface"]
      exceptions: []

    AES204:
      enabled: true
      scope:
        ["taxonomy", "contract", "utility", "capabilities", "agent", "surface"]
      exceptions: []

    AES205:
      enabled: true
      exceptions: []
      scope:
        ["taxonomy", "contract", "utility", "capabilities", "agent", "surface"]

    # ─── AES300: Code Quality ───
    AES301:
      enabled: true
      scope:
        ["taxonomy", "contract", "utility", "capabilities", "agent", "surface"]
      max_lines: 1000
      exceptions: []

    AES302:
      enabled: true
      scope:
        ["taxonomy", "contract", "utility", "capabilities", "agent", "surface"]
      min_lines: 5
      exceptions: []

    AES303:
      enabled: true
      scope:
        ["taxonomy", "contract", "utility", "capabilities", "agent", "surface"]
      exceptions: []

    AES304:
      enabled: true
      scope:
        [
          "taxonomy",
          "utility",
          "contract",
          "capabilities",
          "agent",
          "surface",
          "root",
        ]
      forbidden_bypass:
        [
          "#[allow(",
          "unwrap",
          "expect",
          "panic",
          "todo",
          "unimplemented",
          "unreachable",
          "noqa",
          "type: ignore",
          "eslint-disable",
          "// @ts-ignore",
          "// @ts-expect-error",
          "// @ts-nocheck",
        ]
      exceptions: []

    AES305:
      enabled: true
      scope:
        ["taxonomy", "contract", "utility", "capabilities", "agent", "surface"]
      exceptions: []

    # ─── AES400: Role ───
    AES401:
      enabled: true
      scope:
        ["taxonomy(constant)", "taxonomy(entity,error,event)", "taxonomy(vo)", "taxonomy(request,response)"]

    AES402:
      enabled: true
      scope: ["contract(aggregate)", "contract(protocol)"]
      exceptions: []

    AES403:
      enabled: true
      scope: ["capabilities"]
      max_functions: 30
      max_impl: 5
      exceptions: []

    AES404:
      enabled: true
      scope: ["utility"]
      exceptions: []

    AES405:
      enabled: true
      scope: ["agent(orchestrator)"]
      max_lines: 1000
      exceptions: []

    AES406:
      enabled: true
      scope:
        [
          "surface(command|controller|page|router|entry)",
          "surface(hook|store|action|screen)",
          "surface(component|view|layout)",
        ]
      exceptions: []

    # ─── AES500: Orphan ───
    AES501:
      enabled: true
      scope: ["taxonomy"]

    AES502:
      enabled: true
      scope: ["contract"]

    AES503:
      enabled: true
      scope: ["capabilities"]

    AES504:
      enabled: true
      scope: ["utility"]

    AES505:
      enabled: true
      scope: ["agent"]

    AES506:
      enabled: true
      scope: ["surface"]

    # ─── AES600: Document invariants ───
    # Audits the Markdown document chain, run by `lint-arwaky-cli docs`.
    # One code per category; each carries a violation_type for finer routing.
    AES601: # FR format — id_missing_feature_prefix | field_missing
      enabled: true

    AES602: # Section structure — order | api_subsection | table shape | empty body
      enabled: true

    AES603: # Spec purity — source_file_named | status_leak
      enabled: true

    AES604: # Crosslinks — no_backlog_link | no_prd_link | state_vocab_restated
      enabled: true

    AES605: # Feature folder health — no_orchestrator | shared_has_docs
      enabled: true
      severity: MEDIUM

    AES606: # Doc heading structure — h1_count | h2_missing | h2_unexpected
      enabled: true
      severity: HIGH

    # ─── AES700: Folder structure ───
    # Audits which layer files sit in which workspace member folder, run by
    # `lint-arwaky-cli scan`. One code per folder kind.
    AES701: # Shared folder purity — shared_has_forbidden_files
      enabled: true
      severity: HIGH

    AES702: # Feature folder health — feature_missing_agent | feature_missing_capability
      enabled: true
      severity: MEDIUM

    AES703: # Surface folder purity — surface_has_misplaced_files
      enabled: true
      severity: MEDIUM
